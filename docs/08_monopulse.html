<style>

<body>
<header class="top">
  <a class="btn sm" href="00_index.html" title="シリーズの目次へ">← 目次</a>
  <h1>第8回 モノパルス測角と追尾レーダ</h1>
  <div id="msbar" title="ミッションの達成状況（丸を押すとそのステップへ）"></div>
  <button class="btn sm" id="glBtn" type="button">用語集</button>
  <button class="btn sm" id="themeBtn" type="button" title="ライト／ダーク表示を切り替える">表示: ライト</button>
</header>
<nav id="steps" aria-label="ステップ"></nav>
<div class="layout">
  <article id="read" aria-label="読み物"></article>
  <section id="sim" aria-label="シミュレータ"></section>
</div>
<div class="stepnav">
  <button class="btn" id="prevBtn" type="button">← 前のステップ</button>
  <button class="btn primary" id="nextBtn" type="button">次のステップ →</button>
</div>
<button id="glTab" type="button" aria-label="用語集を開く">用語集</button>
<aside id="gloss" hidden aria-label="用語集"></aside>
<script>
'use strict';
const SIM_NO = 8;
/* ============================================================
   第0回・第5回以降で共通に使う小さな道具
   ============================================================ */
const MINUS = '−';
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gaussGen(seed){ const r = mulberry32(seed); let sp = null; return function(){ if (sp !== null){ const v = sp; sp = null; return v; } const u = Math.sqrt(-2 * Math.log(1 - r())), a = 2 * Math.PI * r(); sp = u * Math.sin(a); return u * Math.cos(a); }; }
const db10 = v => 10 * Math.log10(v);
const SUPD = {'-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹'};
function sup(n){ return String(n).split('').map(c => SUPD[c] || c).join(''); }
function sci(v, d){ if (!(v === v)) return '—'; if (v === 0) return '0'; let e = Math.floor(Math.log10(Math.abs(v))), m = v / Math.pow(10, e); if (Math.abs(m) >= 9.95){ m /= 10; e++; } return fx(m, d === undefined ? 1 : d) + '×10' + sup(e); }
function wilson(k, n){ if (!n) return [0, 1]; const z = 1.96, p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d; return [k === 0 ? 0 : Math.max(0, c - h), k === n ? 1 : Math.min(1, c + h)]; }
function checkTable(R){
  const lab = {ok: '<span class="ok">一致</span>', info: '<span class="info">差あり</span>', ng: '<span class="ng">不一致</span>', ref: '<span class="info">参考</span>'};
  let h = '<h3>ハンドブックの値との照合</h3><p class="sym">「差あり」は条件の違いなどで差があるもの、「参考」はハンドブックに基準値のない確認です（理由は備考）。</p><div class="tw"><table class="t"><tr><th>項目</th><th>ハンドブック（基準）</th><th>このシミュレータ</th><th>判定</th><th>備考</th></tr>';
  for (const r of R) h += '<tr><td>' + r.item + '</td><td>' + r.ref + '</td><td>' + r.calc + '</td><td>' + lab[r.st] + '</td><td><small>' + r.note + '</small></td></tr>';
  return h + '</table></div>';
}
const near = (a, b, tol) => Math.abs(a - b) <= tol ? 'ok' : 'ng';

/* ============================================================
   第8回 モノパルス測角と追尾レーダ：計算部分
   もとにした資料：Radar Handbook 3rd ed. 第9章 Tracking Radar（p.9.1–9.47）
   簡略化：1 つの角度（1 次元）だけを扱う。2 つのビームはガウス形（電圧パターン exp(−2 ln2·(θ∓θs)²/θb²)）で、
           軸から ±θs だけ開いている（スクイント）。和 Σ = 2 つの足し算、差 Δ = 引き算。
           サーボは 1 次の閉ループ（雑音に対する帯域 βn = ループの利得 ÷ 4）。
   ============================================================ */
const RAD = Math.PI / 180, LN2 = Math.LN2;
const DEFAULTS = {thb: 1.5, off: 0, m: 0, tg: 0, weak: false, sq: 0.8, bn: 5, phi: 0, el: 4, R: 10, L: 15, snr: 50};
const S = Object.assign({}, DEFAULTS);
const gb = (th, c, bw) => Math.exp(-2 * LN2 * (th - c) * (th - c) / (bw * bw));
function sd(th, ax, sq, bw){ const a = gb(th - ax, sq, bw), b = gb(th - ax, -sq, bw); return {s: a + b, d: a - b}; }
const ratio = (th, sq, bw) => { const v = sd(th, 0, sq, bw); return v.d / v.s; };
const slope0 = (sq, bw) => 4 * LN2 * sq / (bw * bw);                 // Δ/Σ の軸上での傾き [1/度]。Δ/Σ = tanh(4 ln2·θ·θs/θb²)
function sumBw(sq, bw){ const p0 = Math.pow(sd(0, 0, sq, bw).s, 2); let lo = 0, hi = 4 * bw; for (let i = 0; i < 60; i++){ const m = (lo + hi) / 2; if (Math.pow(sd(m, 0, sq, bw).s, 2) > p0 / 2) lo = m; else hi = m; } return 2 * lo; }   // 和パターンの 3 dB 幅
const kmOf = (sq, bw) => slope0(sq, bw) * sumBw(sq, bw);              // 誤差の傾き km（和のビーム幅あたり。p.9.42）
const sum0 = (sq, bw) => gb(0, sq, bw);                              // 軸上の和信号（ビームを開かないときを 1）
function errSig(ax, src, sq, bw){ let sr = 0, si = 0, dr = 0, di = 0; for (const q of src){ const v = sd(q.th, ax, sq, bw), c = q.a * Math.cos(q.ph), s = q.a * Math.sin(q.ph); sr += v.s * c; si += v.s * s; dr += v.d * c; di += v.d * s; } return {e: (dr * sr + di * si) / (sr * sr + si * si + 1e-300), amp: Math.hypot(sr, si)}; }   // 式9.1：Re(Δ/Σ)
function solveAxis(src, sq, bw, start, span){      // 閉ループの追尾がとどまる軸の向き（誤差信号が ＋ から − に変わる点のうち、start にいちばん近いもの）
  const n = 600, lo = start - span, hi = start + span; let best = null, pv = errSig(lo, src, sq, bw).e;

  [5, 'PDA／JPDA（probabilistic data association）', 'ゲート内の検出点を 1 つに絞らず、「その航跡のものである確率」で重み付けして、まとめて更新に使う方法です。', 'g-pda']
);
GLOSS.push(
  [6, 'AMTI（airborne MTI、航空機搭載MTI）', '航空機に載せたレーダで使う MTI。レーダ自身が動くので、地面のクラッタにもドップラが付く点が、地上のレーダと違う。', 'g-amti'],
  [6, 'プラットフォーム（platform）', 'レーダを載せている乗り物。ここでは航空機のこと。', 'g-platform'],
  [6, '対地速度（ground speed）', '地面に対する機体の速さ。クラッタのドップラは、この速度で決まる。', 'g-ground-speed'],
  [6, 'ボアサイト（boresight）', 'アンテナのビームの中心の方向。', 'g-boresight'],
  [6, '俯角（depression angle）', '水平から下向きに測った、見下ろす角度。', 'g-depression-angle'],
  [6, 'スラントレンジ（slant range）', 'レーダから地面の点までの、斜めの直線距離。', 'g-slant-range'],
  [6, 'プラットフォーム運動スペクトル（platform-motion spectrum）', '機体が動くために、ビームの中の方向ごとにクラッタのドップラが少しずつ違い、その結果として広がったクラッタのスペクトル。真横を見たときにいちばん広い。', 'g-platform-motion-spectrum'],
  [6, 'TACCAR（time-averaged clutter coherent airborne radar）', 'クラッタのエコーの平均的なドップラを測り、それが 0 になるように周波数をずらして、メインビームクラッタを MTI のノッチに合わせる方法。', 'g-taccar'],
  [6, '位相中心（phase center）', 'アンテナが電波を出し入れしている「見かけの 1 点」。開口の中での重みの付け方で、位置を動かせる。', 'g-phase-center'],
  [6, 'DPCA（displaced phase center antenna）', 'パルスごとにアンテナの位相中心をずらして、機体が進んだ分を打ち消し、クラッタからはアンテナが止まっているように見せる方法。', 'g-dpca'],
  [6, '和パターンと差パターン（sum / difference pattern）', 'アンテナの左右半分の信号を、足して作るビーム（和）と、引いて作るビーム（差）。差パターンは中心で 0、左右で符号が反対になる。', 'g-sum-and-difference-pattern'],
  [6, 'ステップ走査補償（step-scan compensation）', 'アンテナが回ることによるエコーの振幅の変化を、差パターンを使って打ち消す方法。ビームを電子的に少し前後に向け、止まっていたように見せる。', 'g-step-scan-compensation'],
  [6, 'CPCT（coincident phase center technique）', '位相中心を開口の前後にもずらして、進行方向の動きによるクラッタの拡がりも打ち消す方法。', 'g-cpct'],
  [6, 'STAP（space-time adaptive processing、時空間適応処理）', 'アンテナの素子ごと（空間）、パルスごと（時間）の信号に受信したデータから計算した重みを掛けて足し合わせ、クラッタや妨害を消す処理。', 'g-stap'],
  [6, '自由度（degrees of freedom）', '適応処理で自由に決められる重みの数。素子の数 × パルスの数が上限。多いほど細かく消せるが、計算と必要なデータが増える。', 'g-degrees-of-freedom']
);
GLOSS.push(
  [7, 'フェーズドアレイ（phased array）', '多数の素子を配列し、各素子の位相を制御することによって、アンテナを機械的に動かさずにビームを走査するアンテナです。', 'g-phased-array'],
  [7, '素子（radiating element、放射素子）', 'アレイを構成する 1 つ 1 つの小さなアンテナです。', 'g-radiating-element'],
  [7, '開口（aperture）', 'アンテナが電波を出し入れする面。直線アレイでは素子の数 × 素子の間隔が開口の長さ。', 'g-aperture'],
  [7, 'アレイファクタ（array factor）', '等方性の素子を配列したと仮定した場合の、アレイ全体の放射パターンです。素子の配置と各素子の振幅・位相で決まります。', 'g-array-factor'],
  [7, '素子パターン（element pattern）', '素子 1 つの放射パターンです。アレイ全体のパターンは、素子パターンとアレイファクタの積になります。', 'g-element-pattern'],
  [7, '移相器（phase shifter）', '各素子の信号の位相を変える部品です。通常はデジタル制御であり、設定できる位相は量子化されています。', 'g-phase-shifter'],
  [7, 'ビーム走査（beam scanning）', 'ビームの向きを変えること。フェーズドアレイでは、素子から素子へ一定の量ずつ位相をずらして行う。', 'g-beam-scanning'],
  [7, 'グレーティングローブ（grating lobe）', '素子間隔が広い場合に、主ビームとは別の方向に生じる、主ビームと同程度の強度のビームです。', 'g-grating-lobe'],
  [7, '照射分布（illumination function）', '開口の上での振幅の付け方。端を弱くするとサイドローブが下がり、ビームが太くなる。', 'g-illumination-function'],
  [7, '開口効率（aperture efficiency）', '重み付けをした開口の利得を、同じ大きさの開口を一様に励振した場合の利得で割った値です。重み付けによってサイドローブを下げると 1 より小さくなります。', 'g-aperture-efficiency'],
  [7, '位相の量子化（phase quantization）', '移相器が決まった刻みでしか位相を設定できないために生じる誤差。', 'g-phase-quantization'],
  [7, '量子化ローブ（quantization lobe）', '位相や振幅の量子化誤差が規則的に並ぶことで、特定の方向に現れる余分なローブ。', 'g-quantization-lobe'],
  [7, '開口充填時間（aperture fill time）', '斜め方向から到来する波が、開口の一端から他端まで到達するのに要する時間です。パルス幅がこれより十分に長くないと、開口の全体が同時に寄与しません。', 'g-aperture-fill-time'],
  [7, '時間遅延走査（time-delay scanning）', '位相ではなく時間の遅れでビームを向ける方法。周波数が変わってもビームの向きが変わらない。', 'g-time-delay-scanning'],
  [7, 'サブアレイ（subarray）', 'アレイの素子をいくつかずつまとめた小さなグループです。サブアレイごとに遅延線や受信機を設けます。', 'g-subarray'],
  [7, 'デジタルビーム形成（DBF、digital beamforming）', '素子またはサブアレイごとに信号をデジタルにしてから、計算で重みを掛けて足し、ビームを作る方法。複数のビームを同時に作れる。', 'g-dbf'],
  [7, 'ヌル（null）', 'パターンの中で感度がほぼ 0 になる方向。妨害の方向にヌルを向けると、妨害を抑えられる。', 'g-null']
);
GLOSS.push(
  [8, 'モノパルス（monopulse）', '複数のビームで同時に受信した信号を比較し、1 つのパルスだけで目標の角度誤差を求める方式です。同時ローブ（simultaneous lobing）とも呼びます。', 'g-monopulse'],
  [8, '振幅比較モノパルス（amplitude-comparison monopulse）', '向きを少しずつずらした複数のビームで受けた信号の、振幅の違いから角度のずれを求めるモノパルス。', 'g-amplitude-comparison-monopulse'],
  [8, '和信号と差信号（sum / difference signals、Σ・Δ）', '複数のビームの信号を足したもの（和、Σ）と引いたもの（差、Δ）。和は目標の検出と距離の測定に、差は角度のずれの測定に使う。', 'g-sum-and-difference-signals'],
  [8, 'コンパレータ（comparator）', 'ホーン（給電部）の信号を足し引きして、和信号と差信号を作るマイクロ波の回路。', 'g-comparator'],
  [8, '角度誤差信号（angle-error signal）', 'アンテナの軸と目標の方向のずれを表す信号。モノパルスでは差信号を和信号で割って作る。大きさがずれの量、符号がずれの向きを表す。', 'g-angle-error-signal'],
  [8, '誤差の傾き（error slope、km）', '目標が軸から少しずれたときに、角度誤差信号（Δ/Σ）がどれだけ変わるかを表す値。ビーム幅 1 つぶんのずれに対する変化で表す。大きいほど、雑音に強い。', 'g-error-slope'],
  [8, 'ビームの開き（beam offset、squint angle）', '角度を測るためにビームをアンテナの軸からわざとずらす角度。', 'g-squint-angle'],
  [8, '円錐走査（conical scan）', '軸から少しずらしたビームを、軸のまわりに回す方式。エコーの強さの変化（変調）の大きさと位相から、角度のずれを求める。', 'g-conical-scan'],
  [8, 'ローブ切替（sequential lobing）', 'ビームの向きを、いくつかの位置に順番に切り替えて、エコーの強さを比べる方式。', 'g-sequential-lobing'],
  [8, 'AGC（automatic gain control、自動利得制御）', '信号の強さが変わっても出力が一定になるように、受信機の利得を自動で変えるしくみ。モノパルスでは和信号で割り算をする役目を持つ。', 'g-agc'],
  [8, 'サーボ（servo）', '誤差信号が 0 になるように、アンテナを自動で動かすしくみ。', 'g-servo'],
  [8, 'サーボ帯域幅（servo bandwidth）', 'サーボが追従できる周波数の上限です。広いほど応答は速くなりますが、雑音の影響も受けやすくなります。', 'g-servo-bandwidth'],
  [8, '捕捉（acquisition）', '追尾を始めるために、目標をビームと距離ゲートの中にとらえること。', 'g-acquisition'],
  [8, '早期ゲートと後期ゲート（early / late gates）', '距離ゲートを前半と後半に分けたものです。それぞれに入るエコーのエネルギーを比較して、ゲートの中心と目標の距離との差を求めます。', 'g-early-late-gates'],
  [8, 'グリント（glint、角度雑音）', '目標内の複数の反射点からのエコーが干渉して、見かけの到来方向が不規則に変動する現象です。見かけの方向が目標の外側に出ることもあります。', 'g-glint'],
  [8, 'シンチレーション（scintillation、振幅雑音）', '目標のエコーの振幅が時間とともに変動する現象です。', 'g-scintillation'],
  [8, 'マルチパス（multipath、多重反射）', '直接の経路に加えて地面や海面で反射した経路も通り、電波が 2 つ以上の経路で到達する現象です。', 'g-multipath'],
  [8, '鏡像（image、イメージ）', '地面や海面での反射によって、反射面の下に目標があるように見えるものです。鏡に映った像に相当します。', 'g-image'],
  [8, 'ミリラジアン（mrad）', '角度の単位です。1 mrad = 0.001 ラジアン ≈ 0.057° であり、距離 1 km で幅 1 m を見込む角度に当たります。', 'g-mrad']
);
GLOSS.push(
  [9, '伝搬（propagation）', '電波が空間を伝わること。大気や地面・海面の影響で、伝わり方が変わる。', 'g-propagation'],
  [9, '自由空間（free space）', '地球や大気の影響がまったくない、理想的な空間。伝わり方を比べるときの基準にする。', 'g-free-space'],
  [9, '伝搬因子（propagation factor、F）', '実際の電界強度を同じ距離での自由空間の電界強度で割った値です。1 より大きければ自由空間より強く、小さければ弱いことを表します。', 'g-propagation-factor'],
  [9, '自由空間伝搬損失（free-space path loss）', '自由空間で等方性アンテナどうしの間に生じる伝搬損失（片道）です。距離の 2 乗と周波数の 2 乗に比例します。', 'g-free-space-path-loss'],
  [9, '伝搬損失（propagation loss）', '等方性アンテナどうしの間での送信電力と受信電力の比を dB で表した値です。自由空間伝搬損失から 20·log F を引いた値になります。', 'g-propagation-loss'],
  [9, '屈折（refraction）', '電波が空気の性質の違う所を通るときに、進む向きを変えること。', 'g-refraction'],
  [9, '屈折率（index of refraction、n）', '真空中の電波の速さを、その場所での速さで割った値。地表近くの空気では 1.00025〜1.0004。', 'g-index-of-refraction'],
  [9, '屈折度（refractivity、N）', '屈折率 n から 1 を引いて 10⁶ 倍した値です。地表付近では 300 前後であり、高度とともに減少します。', 'g-refractivity'],
  [9, '修正屈折度（modified refractivity、M）', '屈折度 N に地球の曲率に相当する項（高度 1 km につき約 157）を加えた値です。M が高度とともに減少する層がダクトです。', 'g-modified-refractivity'],
  [9, '標準大気（standard atmosphere）', '屈折度が高度 1 km につき約 39 N だけ減少する、平均的な大気の状態です。等価地球半径係数は約 4/3 になります。', 'g-standard-atmosphere'],
  [9, '等価地球半径（effective earth radius）', '屈折による電波の曲がりを直線で表すために、実際より大きく仮定した地球の半径です。標準大気では実際の半径の約 4/3 倍になります。', 'g-effective-earth-radius'],
  [9, 'レーダ水平線（radar horizon）', 'レーダから出た電波が、地球の表面にちょうど接する点。これより先の低い所は、地球の陰になる。', 'g-radar-horizon'],
  [9, '見通し距離（line-of-sight range）', 'アンテナと目標が地球の陰に入らずに互いを直接見通せる最大の距離です。アンテナと目標のそれぞれのレーダ水平線までの距離の和になります。', 'g-line-of-sight-range'],
  [9, '回折（diffraction）', '電波が障害物の陰に少し回り込むこと。周波数が低いほど回り込みやすい。', 'g-diffraction'],
  [9, '反射係数（reflection coefficient）', '反射波の電界強度を入射波の電界強度で割った値です。滑らかな海面に浅い角度で入射する場合は 1 に近くなります。', 'g-reflection-coefficient'],
  [9, '直接波と反射波（direct / reflected wave）', 'レーダと目標のあいだをまっすぐ進む波（直接波）と、海面や地面で一度反射して届く波（反射波）。', 'g-direct-and-reflected-wave'],
  [9, 'ローブ（lobe）', '直接波と反射波が強め合って、電波が強くなる角度の範囲。高さの方向にヌルと交互に並ぶ。', 'g-lobe'],
  [9, 'カバレッジ図（coverage diagram）', '距離と高度の平面上に、探知できる範囲や伝搬損失を示した図です。', 'g-coverage-diagram'],
  [9, '異常伝搬（anomalous propagation）', '大気が標準の状態と違うために、電波の曲がり方がふつうと違うこと。', 'g-anomalous-propagation'],
  [9, 'サブリフラクション（subrefraction）', '電波がふつうより曲がらない、または上向きに曲がる状態。見通し距離が短くなる。', 'g-subrefraction'],
  [9, 'スーパーリフラクション（superrefraction）', '電波がふつうより強く下向きに曲がる状態。見通し距離が長くなる。', 'g-superrefraction'],
  [9, 'トラッピング（trapping）', '電波の曲がりが地球の丸みより強くなり、電波が大気の層の中に閉じ込められる状態。', 'g-trapping'],
  [9, 'ダクト（duct）', '電波が捕捉されて、地表に沿って遠距離まで伝搬する大気の層です。修正屈折度 M が高度とともに減少する層に当たります。', 'g-duct'],
  [9, '蒸発ダクト（evaporation duct）', '海面の直上で水蒸気量が高度とともに急激に減少するために形成されるダクトです。海上ではほぼ常に存在します。', 'g-evaporation-duct'],
  [9, 'レーダホール（radar hole）', 'ダクトによって電波が到達しにくくなる、ダクトの直上の領域です。この領域にある目標は探知しにくくなります。', 'g-radar-hole'],
  [9, 'スキップゾーン（skip zone）', '水平線の近くで、ダクトの効果が現れない距離の範囲。', 'g-skip-zone']
);
GLOSS.push(
  [10, '散乱（scattering）', '電波が物体に当たって、いろいろな方向へ散らばること。', 'g-scattering'],
  [10, '後方散乱（backscattering）', '散乱のうち、電波が来た方向（レーダの方向）へ戻る分。これがレーダのエコーになる。', 'g-backscattering'],
  [10, 'dBsm', 'RCS を 1 m² を基準にしたデシベルで表した単位。0 dBsm = 1 m²、20 dBsm = 100 m²、−20 dBsm = 0.01 m²。', 'g-dbsm'],
  [10, 'アスペクト角（aspect angle）', 'レーダから見た目標の向きを表す角度。', 'g-aspect-angle'],
  [10, '反射点（scatterer / scattering center、散乱中心）', '目標の表面のうち、エコーを強く返す箇所です。複雑な形状の目標は、多数の反射点の集合として扱います。', 'g-scatterer'],
  [10, '鏡面反射（specular reflection）', 'レーダの視線に垂直な面が、鏡のように電波をまっすぐ返す反射。その方向では強いが、少し向きがずれると急に弱くなる。', 'g-specular-reflection'],
  [10, 'レイリー領域（Rayleigh region）', '目標が波長より小さい範囲。RCS は周波数の 4 乗に比例して急に変わり、形の細かい違いは効かない。', 'g-rayleigh-region'],
  [10, '共振領域（resonance region）', '目標が波長と同じくらいの範囲。いくつかの反射の仕組みが干渉して、RCS が大きさ（周波数）とともに波打つ。', 'g-resonance-region'],
  [10, '光学領域（optics region）', '目標が波長よりずっと大きい範囲。光の反射のように考える近似がよく合う。', 'g-optics-region'],
  [10, 'クリーピング波（creeping wave）', '球などの陰の側を回り込んで戻ってくる波。', 'g-creeping-wave'],
  [10, '進行波エコー（traveling-wave echo）', '電波が表面にごく浅い角度で入ったとき、表面に沿って進む波が端で反射して戻るエコー。', 'g-traveling-wave-echo'],
  [10, 'コーナーリフレクタ（corner reflector）', '2 枚または 3 枚の平らな板を直角に組み合わせたもの。広い範囲の向きから来た電波を、来た方向へ返す。', 'g-corner-reflector'],
  [10, '幾何光学（geometric optics、GO）', '電波を光線として扱い、反射点での面の曲がり方から RCS を求める近似。', 'g-geometric-optics'],
  [10, '物理光学（physical optics、PO）', '面の上に流れる電流を近似して足し合わせ、RCS を求める方法。平らな面や、一方向だけ曲がった面に使う。', 'g-physical-optics'],
  [10, 'モーメント法（method of moments）', '面の上の電流についての方程式を、連立 1 次方程式に直して解く方法。厳密だが、大きな目標では計算量が大きい。', 'g-method-of-moments'],
  [10, 'バイスタティック（bistatic）', '送信と受信を離れた別々の場所で行うこと。同じ場所で行う場合はモノスタティックという。', 'g-bistatic'],
  [10, '遠方界の条件（far-field criterion）', '目標に当たる波を平面の波とみなせる距離の目安。距離 R > 2D²/λ（D は目標の大きさ）。', 'g-far-field-criterion'],
  [10, 'コンパクトレンジ（compact range）', '反射鏡などで平面の波を作り、短い距離で RCS を測れるようにした屋内の測定設備。', 'g-compact-range'],
  [10, '電波吸収材（radar-absorbing material、RAM）', '入ってきた電波のエネルギーを吸収して、反射を弱める材料。', 'g-ram'],
  [10, 'サリスバリースクリーン（Salisbury screen）', '金属面の 1/4 波長手前に抵抗の膜を置いた、いちばん簡単な吸収体。設計した周波数の近くだけで効く。', 'g-salisbury-screen'],
  [10, '形状制御（shaping）', '面や縁の向きを選んで、エコーをレーダの方向からそらす設計のしかた。', 'g-shaping']
);
GLOSS.push(
  [11, '合成開口レーダ（SAR、synthetic aperture radar）', '小さなアンテナを動かしながら集めた信号を合成して、長いアンテナと同じ細かさの分解能を得るレーダ。地表の画像を作るのに使う。', 'g-sar'],
  [11, '実開口レーダ（RAR、real aperture radar）', 'アンテナそのものの大きさ（ビーム幅）で分解能が決まる、ふつうのレーダ。', 'g-real-aperture-radar'],
  [11, '合成開口（synthetic aperture）', 'プラットフォームが動いた経路を、1 本の長いアンテナとみなしたもの。その長さを合成開口長、目標から見たその角度を合成開口角という。', 'g-synthetic-aperture'],
  [11, 'レンジ方向とクロスレンジ方向（range / crossrange）', 'レーダの視線に沿った方向（レンジ）と、それに垂直で地面に平行な方向（クロスレンジ）。クロスレンジはアジマス方向ともいう。', 'g-range-and-crossrange'],
  [11, 'クロスレンジ分解能（crossrange resolution）', '視線に垂直な方向で、位置をどれだけ細かく決められるか。アジマス分解能ともいう。', 'g-crossrange-resolution'],
  [11, 'ストリップマップ（stripmap SAR）', 'ビームを飛行経路に垂直に向けたまま飛び、帯のような範囲を連続して画像にする方式。', 'g-stripmap-sar'],
  [11, 'スポットライト（spotlight SAR）', '飛びながらビームを同じ場所に向け続け、その場所を細かい分解能で画像にする方式。', 'g-spotlight-sar'],
  [11, 'ドップラビームシャープニング（DBS、doppler beam sharpening）', 'ビームの中のエコーをドップラ周波数で分けて、ビーム幅より細かい分解能を得る方法。SAR の最初の呼び名でもある。', 'g-dbs'],
  [11, '非集束 SAR（unfocused SAR）', '位相の補正をせずに信号を足し合わせる、初期の SAR。使える合成開口の長さに限りがある。', 'g-unfocused-sar'],
  [11, '位相履歴（phase history）', 'プラットフォームが動くあいだに、1 つの目標からのエコーの位相がたどる変化。', 'g-phase-history'],
  [11, 'ファストタイムとスロータイム（fast time / slow time）', '1 つのパルスの中の時間（距離に対応）と、パルスからパルスへの時間（クロスレンジに対応）。', 'g-fast-and-slow-time'],
  [11, 'スクイント角（squint angle、SAR の場合）', 'アンテナの向きが、飛行経路に垂直な方向からずれている角度。', 'g-squint-angle-sar'],
  [11, '動揺補償（motion compensation）', 'プラットフォームが理想の直線からずれた分を測り、信号の位相を直す処理。', 'g-motion-compensation'],
  [11, 'レンジマイグレーション（range migration）', 'データを集めるあいだに、目標までの距離が変わって、別の距離セルへ移ってしまうこと。', 'g-range-migration'],
  [11, 'スラントプレーンとグランドプレーン（slant plane / ground plane）', '視線に沿った斜めの面（スラント）と、地面（グランド）。距離分解能は地面の上ではスラントより粗くなる。', 'g-slant-and-ground-plane'],
  [11, '点像応答（point spread function / impulse response）', '点の目標 1 つが、画像の上でどう広がって写るかを表すもの。', 'g-point-spread-function'],
  [11, '積分サイドローブ比（ISLR、integrated sidelobe ratio）', '点像応答のサイドローブ全体のエネルギーを、メインローブのエネルギーで割った値。', 'g-islr'],
  [11, 'スペックル（speckle）', '一様な地面でも画素ごとに明るさがばらつく現象。画素の中の多数の散乱体のエコーが干渉して起きる。', 'g-speckle'],
  [11, 'マルチルック（multilook）', '同じ場所の画像を何枚か作って明るさを平均し、スペックルを減らす処理。', 'g-multilook'],
  [11, '雑音等価 σ⁰（NEσ⁰、noise-equivalent sigma zero）', '受信機の雑音と同じ明るさに写る、地面の反射の強さ。これより暗い地面は雑音に埋もれる。', 'g-nesz'],
  [11, '逆合成開口レーダ（ISAR、inverse SAR）', 'レーダではなく目標の動き（回転）を利用して、目標の画像を作る方法。', 'g-isar'],
  [11, '干渉 SAR（InSAR、interferometric SAR）', '2 つのアンテナの信号の位相の差を使って、高さや動きを測る SAR。', 'g-insar']
);
GLOSS.push(
  [12, '電子戦（EW、electronic warfare）', '電磁波の利用をめぐる軍事的な活動の全体。相手の電波を探ること、相手の利用を妨げること、自分の利用を守ることを含む。', 'g-electronic-warfare'],
  [12, '電子支援（ESM、electronic warfare support measures）', '相手が出す電波を探し、傍受し、位置や種類を調べること。新しい用語では ES。', 'g-esm'],
  [12, '電子攻撃（ECM、electronic countermeasures）', '相手のレーダなどが電磁波を有効に使うのを、妨げたり弱めたりすること。新しい用語では EA。', 'g-ecm'],
  [12, '電子防護（ECCM、electronic counter-countermeasures）', '相手の電子攻撃があっても、レーダなどが電磁波を有効に使えるようにする、レーダ側の工夫。新しい用語では EP。', 'g-eccm'],
  [12, '妨害（jamming）', 'レーダの受信を妨げる目的で電波を放射することです。そのための装置を妨害機（jammer）と呼びます。', 'g-jamming'],
  [12, '雑音妨害（noise jamming）', '雑音のような電波でレーダの受信帯域を埋め、目標のエコーを埋もれさせる妨害。狭い帯域に集中するスポット妨害と、広い帯域を覆うバラージ妨害がある。', 'g-noise-jamming'],
  [12, '欺まん（deception）', 'にせの信号でレーダに誤った情報（偽の目標、誤った距離・速度・角度）を与えること。', 'g-deception'],
  [12, 'チャフ（chaff）', '空中にまく、金属を付けた細い繊維や箔。レーダから見ると、雨雲のようなクラッタになる。', 'g-chaff'],
  [12, 'デコイ（decoy）', '本物の目標のように見せるための、おとりの物体。', 'g-decoy'],
  [12, '自己防御妨害とスタンドオフ妨害（SSJ / SOJ）', '目標自身が妨害の電波を出す場合（自己防御、self-screening jammer）と、離れた場所の別の機体が出す場合（スタンドオフ、stand-off jammer）。', 'g-ssj-soj'],
  [12, '実効放射電力（ERP、effective radiated power）', '送信電力にアンテナ利得を掛けた値。その方向へどれだけ強く電波を出しているかを表す。', 'g-erp'],
  [12, '妨害対雑音比（J/N、JNR）', '受信機に入る妨害の電力を、受信機の雑音の電力で割った値。', 'g-jnr'],
  [12, '信号対妨害比（S/J）', '目標のエコーの電力を、妨害の電力で割った値。', 'g-sjr'],
  [12, 'バーンスルー（burn-through）', '目標が近づいて、エコーが妨害より強くなり、妨害の中でも探知できるようになること。その距離をバーンスルー距離という。', 'g-burn-through'],
  [12, 'サイドローブブランキング（SLB、sidelobe blanking）', '主アンテナと利得の低い補助アンテナの受信の強さを比べ、サイドローブから入ったと判断した信号を表示・検出から外すしくみ。', 'g-sidelobe-blanking'],
  [12, 'サイドローブキャンセラ（SLC、sidelobe canceler）', '補助アンテナで受けた妨害に重みを掛けて、主アンテナの信号から引き、サイドローブから入る妨害を打ち消すしくみ。', 'g-sidelobe-canceler'],
  [12, '補助アンテナ（auxiliary antenna）', 'SLB や SLC のために、主アンテナのそばに置く、利得が低くビームの広いアンテナ。', 'g-auxiliary-antenna'],
  [12, '妨害消去比（JCR、jammer cancellation ratio）', 'サイドローブキャンセラを使わないときと使ったときの、出力の妨害電力の比。', 'g-jammer-cancellation-ratio'],
  [12, '適応アレイ（adaptive array）', '受信した信号に合わせて、素子ごとの重みを自動で変えるアレイアンテナ。妨害の方向にヌルを作る。', 'g-adaptive-array'],
  [12, '周波数アジリティ（frequency agility）', '送信周波数をパルスごと、またはパルスのまとまりごとに切り替えること。', 'g-frequency-agility'],
  [12, '周波数ダイバーシティ（frequency diversity）', 'いくつかの違う周波数を、同時に、または組み合わせて使うこと。', 'g-frequency-diversity'],
  [12, '低被探知性（LPI、low probability of intercept）', '相手の受信機に見つかりにくいように、レーダの電波の出し方を工夫すること。', 'g-lpi'],
  [12, 'レーダ警報受信機（RWR、radar warning receiver）', 'レーダの電波を受けて、照らされていることとその方向を知らせる受信機。', 'g-rwr'],
  [12, '電波管制（EMCON、emission control）', '位置や意図を知られないように、電波を出す時間・方向・周波数などを管理すること。', 'g-emcon'],
  [12, 'ダイナミックレンジ（dynamic range）', '受信機が歪みなく扱える最大の信号と、雑音レベルとの比です。強いクラッタや妨害があっても飽和しないために必要です。', 'g-dynamic-range']
);
GLOSS.push(
  [13, 'レーダ資源管理（radar resource management）', 'レーダが持つ限られた時間とエネルギーを、捜索・追尾などの仕事にどう割り振るかを決めること。', 'g-radar-resource-management'],
  [13, 'ドウェル（dwell）とドウェル時間（dwell time）', 'ビームを 1 つのビーム位置に向けて送受信を行う、ひとまとまりの動作をドウェルと呼びます。その長さがドウェル時間であり、1 つのビーム位置を照射する時間に当たります。', 'g-dwell'],
  [13, 'スケジューラ（scheduler）', '頼まれた仕事（タスク）を、いつ実行するかを決めて、時間の上に並べるしくみ。', 'g-scheduler'],
  [13, '占有率（occupancy）', 'レーダの時間のうち、照射に使われている割合。', 'g-occupancy'],
  [13, 'スケジューラの効率（scheduler efficiency）', '（全時間 − すき間の合計）÷ 全時間。すき間なく並べられたかを表す。', 'g-scheduler-efficiency'],
  [13, '固定タスク（fixed task）', '実行してほしい時刻が決まっているタスク。追尾の更新など。少しだけ前後にずらせる。', 'g-fixed-task'],
  [13, '柔軟タスク（flexible task）', '実行する時刻は決まっていないが、決まった一巡（パターン）を、ある周期で回し続けたいタスク。捜索など。', 'g-flexible-task'],
  [13, '希望時刻（requested time）', '固定タスクを実行してほしい時刻。', 'g-requested-time'],
  [13, 'ずれの許容（slack）', '固定タスクの実行を、希望時刻から前後にずらしてよい幅。', 'g-slack'],
  [13, 'フレーム時間（frame time）', '捜索範囲全体を 1 回捜索する時間です。同じ方向を再び照射するまでの時間に当たります。', 'g-frame-time'],
  [13, '望みのフレーム時間（DFT、desired frame time）', '柔軟タスクのパターンを一巡させたい周期。', 'g-desired-frame-time'],
  [13, 'パターンの長さ（PL、pattern length）', '柔軟タスクのパターン 1 巡ぶんの照射の時間の合計。', 'g-pattern-length'],
  [13, 'スケジューリング区間（RSI、radar scheduling interval）', 'スケジューラがタスクを並べる、ひと区切りの時間。従来の方式では長さが決まっている。', 'g-rsi'],
  [13, '可変のスケジューリング区間（DRSI、dynamic RSI）', '固定タスクの終わりから、次の固定タスクの終わりまでを 1 区間とする考え方。区間の長さがそのつど変わる。', 'g-drsi'],
  [13, '次の固定タスク（NFT、next fixed task）', '次に実行する固定タスク。これが可変のスケジューリング区間の終わりを決める。', 'g-next-fixed-task'],
  [13, '柔軟タスクの遅れ（FTD、flexible task deficit）', '「今の時点で済んでいるはずの量」から「実際に済んだ量」を引いたもの。大きいほど、そのタスクは遅れている。', 'g-flexible-task-deficit'],
  [13, '期限の近い順（EDF、earliest-deadline-first）', '期限がいちばん近い仕事から先に実行する、スケジューリングの方法。計算機の処理の順番決めに使われている。', 'g-edf'],
  [13, '貪欲なスケジューラ（greedy scheduler）', '先のことを考えず、その場でいちばん優先度の高いものから順に入れていくスケジューラ。', 'g-greedy-scheduler'],
  [14, 'エリア MTI（area MTI）', 'クラッタの消え残りを場所ごとに記憶しておき、次のスキャンで差し引く（または割る）方法。今はクラッタマップと呼ぶことが多い。', 'g-area-mti'],
  [14, 'マップセル（map cell）', 'クラッタマップの 1 マス。距離と方位で区切る。分解能のセルいくつかをまとめて 1 マスにすることが多い。', 'g-map-cell'],
  [14, '再帰フィルタ（recursive filter）', '前の出力に新しい入力を一定の割合で混ぜて、次の出力にするフィルタ。過去の値を全部しまっておかなくても、平均に近い値が得られる。', 'g-recursive-filter'],
  [14, 'フィルタの定数 α', '再帰フィルタで新しい入力を混ぜる割合（0〜1）。小さいほど、長い期間の平均になる。', 'g-map-filter-constant'],
  [14, '実効的な平均の回数（Leff）', '再帰フィルタが同じ重みで何回ぶんを平均したのと同じ落ち着きを持つかを表す数。(2 − α) ÷ α。', 'g-effective-averages'],
  [14, 'クラッタマップ損失（clutter map loss）', '背景の平均を地図から見積もるために、余分に必要になる S/N。平均の回数が少ないほど大きい。', 'g-clutter-map-loss'],
  [14, '立ち上がり（過渡応答、transient response）', '背景が急に変わったとき（新しいクラッタが現れたときなど）に、地図の値が新しい強さになじむまでの様子。', 'g-transient-response'],
  [14, 'カットオフ速度（cutoff velocity）', 'クラッタマップが目標を背景として覚えはじめる、目標の速さの境目。マップセルの大きさとスキャンの間隔で決まる。', 'g-cutoff-velocity'],
  [14, 'スプレッディング（spreading）', 'マップセルをその中の受信だけでなく、隣のセルの受信も使って更新すること。クラッタがマスの境目をまたいだときの誤警報を抑える。', 'g-spreading'],
  [14, 'ゼロ速度フィルタ（zero-velocity filter）', 'ドップラが 0 に近い成分だけを取り出すフィルタ。止まっているクラッタと、視線を横切る目標が、ここに出る。', 'g-zero-velocity-filter'],
  [14, 'MTD（moving target detector）', 'ドップラフィルタバンク、ゼロ速度フィルタ、クラッタマップなどを組み合わせた、目標検出の方式。', 'g-mtd'],
  [14, 'スーパークラッタビジビリティ（superclutter visibility）', '点のクラッタの上を飛ぶ目標を、目標のほうがクラッタより強いことを利用して検出できること。', 'g-superclutter-visibility'],
  [14, '点のクラッタ（discrete clutter / point clutter）', '建物や鉄塔のように、1 つのセルに集中して現れる強いクラッタ。', 'g-discrete-clutter'],
  [14, 'PPI（plan position indicator）', 'レーダを中心に置き、方位と距離でまわりの様子を円形に描く表示。上から見た地図のように見える。', 'g-ppi'],
  [15, '最大探知距離（maximum detection range、Rmax）', '受信電力が最小検出信号と等しくなる距離です。これより遠い目標は検出できません。レーダ方程式から求めます。', 'g-maximum-detection-range'],
  [15, '熱雑音（thermal noise）', '受信機内の電子の熱運動によって生じる雑音です。その電力は 1 Hz あたり k·T₀ = 4×10⁻²¹ W（T₀ = 290 K）であり、受信機の帯域幅に比例します。', 'g-thermal-noise'],
  [15, '受信機の帯域幅（receiver bandwidth、B）', '受信機が通過させる周波数の幅です。広いほど雑音電力も増加します。通常はパルス幅の逆数程度に選びます（B·τ ≈ 1）。', 'g-receiver-bandwidth'],
  [15, '検出に必要な S/N（required S/N、(S/N)₁）', '1 つのパルスで所定の誤警報確率と検出確率を満たすために必要な S/N です。判定の基準と目標の RCS 変動の有無によって決まります。', 'g-required-snr-single-pulse'],
  [15, '積分効率（integration efficiency、Ei(n)）', 'n 個のパルスを積分したときに、理想（S/N が n 倍）に対してどれだけの改善が得られるかを表す数（0〜1）です。コヒーレント積分では 1 になります。', 'g-integration-efficiency'],
  [15, 'コヒーレント積分とノンコヒーレント積分（coherent / noncoherent integration）', '位相をそろえてパルスを加算する方法がコヒーレント積分、検波後の振幅だけを加算する方法がノンコヒーレント積分（非コヒーレント積分）です。後者の積分効率は 1 より小さくなります。', 'g-coherent-noncoherent-integration'],
  [15, 'デューティ比（duty cycle）', 'パルスを送信している時間の割合であり、パルス幅 × パルス繰り返し周波数で求められます。平均電力 = 尖頭電力 × デューティ比 の関係があります。', 'g-duty-cycle'],
  [15, 'システム損失（system loss、Ls）', '理想的な式で求めた値に対して実際の性能を低下させる要因を、まとめて表す数（1 より大きい）です。すべてを計上すると 10〜20 dB になることも珍しくありません。', 'g-system-loss'],
  [15, '立体角（solid angle、Ω）', '空間内の方向の範囲の大きさを表す量です。単位はステラジアン [sr] であり、全方向は 4π sr です。', 'g-solid-angle'],
  [15, 'ビームの立体角（beam solid angle、Ω₀）', 'アンテナのビームが占める立体角です。利得とは G = 4π/Ω₀ の関係があります。', 'g-beam-solid-angle'],
  [15, '電力開口積（power-aperture product）', '平均電力と有効開口面積の積 Pav·Ae です。捜索レーダの探知距離を決める量のうち、設計で選択できる最も重要なものです。', 'g-power-aperture-product'],
  [16, '送信機（transmitter）', '仕事に合った波形を作り、増幅して送り出す部分。性能を表すのは、尖頭電力より平均電力。', 'g-transmitter'],
  [16, '送受切換器（デュプレクサ、duplexer）', '1 つのアンテナを送信と受信で共用するための部分。送信中は受信機を守り、受信中はエコーを受信機へ導く。', 'g-duplexer'],
  [16, '受信機（receiver）', '弱いエコーを検出できる強さまで増幅する部分。自分自身が出す雑音が、検出の限界を決める。', 'g-receiver'],
  [16, '低雑音増幅器（LNA、low-noise amplifier）', '受信機の初段に置く、雑音の少ない増幅器。受信機全体の雑音は、ほぼここで決まる。', 'g-lna'],
  [16, '信号処理（signal processing）', '欲しい信号を検出のじゃまになる信号（雑音、クラッタなど）から分ける部分。整合フィルタやドップラ処理が入る。', 'g-signal-processing'],
  [16, 'ドップラ処理（doppler processing）', 'パルスごとの位相の変化（ドップラ周波数）を使って、動く目標をクラッタやほかの目標から分ける処理。', 'g-doppler-processing'],

/* ============================================================

   説明は、この HTML の中の GLOSS（[グループ, 見出し, 説明, ID]）から引く。印は、組み立てのときに gterm.py が a.gt に直す。

  const left = Math.max(8, Math.min(r.left, dw - pw - 8)) + window.scrollX;

  gPop.setAttribute('role', 'dialog'); gPop.setAttribute('aria-label', '用語の説明：' + t[1].replace(/<[^>]*>/g, '')); gPop.tabIndex = -1;

/* 右端の用語集のパネルを開いて、ID の用語を見せる */
