<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第1回 パルス圧縮</title>
<style>
:root{

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --ref:#8a8983; --hl:#b4279a;
  --band:rgba(42,120,214,.10); --band2:rgba(235,104,52,.12); --bandn:rgba(120,119,112,.14); --band3:rgba(27,175,122,.14);
  --accent:#1c5cab; --accent-bg:#e4eefb; --warn:#8a5a00; --warn-bg:#fdf1d3; --ok:#0a6b0a; --ok-bg:#e2f3e2; --ng:#b02a2a;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110; --surface:#1a1a19; --surface2:#242423; --border:#3a3a37;
  --text:#f0efec; --text2:#c3c2b7; --muted:#96958c; --grid:#2d2d2a; --axis:#6a6963;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ref:#96958c; --hl:#e56bd0;
  --band:rgba(57,135,229,.16); --band2:rgba(217,89,38,.18); --bandn:rgba(150,149,140,.16); --band3:rgba(25,158,112,.20);
  --accent:#86b6ef; --accent-bg:#1c2c44; --warn:#f0c869; --warn-bg:#3a2f12; --ok:#5fd05f; --ok-bg:#16301a; --ng:#f08a8a;
}

body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.75;
  font-family:"Yu Gothic UI","Meiryo UI","Meiryo","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
header.top h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
#msbar{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:12px;color:var(--text2);overflow:hidden;white-space:nowrap}
#msbar button{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--axis);background:none;padding:0;cursor:pointer;font-size:10px;line-height:1;color:transparent;flex:none}
#msbar button.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
#msbar b{margin-left:6px;color:var(--text);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;line-height:1.4;white-space:nowrap;text-decoration:none;color:var(--text);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.sm{padding:2px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
nav#steps{display:flex;flex-wrap:wrap;gap:5px;max-width:1480px;margin:10px auto 0;padding:0 14px}
nav#steps button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:2px 10px 2px 3px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}

nav#steps button.done i{background:var(--ok);color:var(--surface)}
.layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;max-width:1480px;margin:0 auto;padding:10px 40px 30px 14px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}

.tw{overflow-x:auto}

.gpop:focus{outline:2px solid var(--accent);outline-offset:1px}

</style>

<body>
<header class="top">
  <a class="btn sm" href="00_index.html" title="シリーズの目次へ">← 目次</a>
  <h1>第1回 パルス圧縮</h1>
  <div id="msbar" title="ミッションの達成状況（丸を押すとそのステップへ）"></div>
  <button class="btn sm" id="glBtn" type="button">用語集</button>
  <button class="btn sm" id="themeBtn" type="button" title="ライト／ダーク表示を切り替える">表示: ライト</button>
</header>
<nav id="steps" aria-label="ステップ"></nav>
<div class="layout">
  <article id="read" aria-label="読み物"></article>
  <section id="sim" aria-label="シミュレータ"></section>
</div>
<div class="stepnav">
  <button class="btn" id="prevBtn" type="button">← 前のステップ</button>
  <button class="btn primary" id="nextBtn" type="button">次のステップ →</button>
</div>
<button id="glTab" type="button" aria-label="用語集を開く">用語集</button>
<aside id="gloss" hidden aria-label="用語集"></aside>
<script>
'use strict';
const SIM_NO = 1;
'use strict';
/* ============================================================
   計算モデル（複素ベースバンド、サンプリング周波数は固定）
   ============================================================ */
const FS = 10e6;          // サンプリング周波数 [Hz]（固定）
const C = 3e8;            // 光速 [m/s]（150 m/µs）
const L = 4096;           // 受信系列の長さ [サンプル]（409.6 µs ≒ 61 km）
const NF = 8192;          // パルス圧縮に使うFFT長
const MINUS = '−';
/* テイラー重み付け（−40 dB, n̄=6）の係数 F1〜F5：ハンドブック p.8.8 */
const TAYLOR = [0.389116, -0.00945245, 0.00488172, -0.00161019, 0.000347037];
/* 既知の2値バーカー符号：ハンドブック 表8.4（p.8.17） */
const BARKER = {2:'10', 3:'110', 4:'1101', 5:'11101', 7:'1110010', 11:'11100010010', 13:'1111100110101'};

/* 共通設定（全ステップで共有） */
const DEFAULTS = {wave:'lfm', T:40, B:2, wt:'none', r1:20, a1:0, t2:true, dr:600, a2:0, noise:false, snr:-10, fd:0, seed:1};
const S = Object.assign({}, DEFAULTS);

const db = v => 20 * Math.log10(Math.max(v, 1e-12));
const db2a = d => Math.pow(10, d / 20);

/* ---------- FFT（基数2、インプレース） ---------- */
const _tw = new Map();
function _tables(n){
  let t = _tw.get(n);
  if (!t){
    const c = new Float64Array(n/2), s = new Float64Array(n/2), r = new Uint32Array(n);
    for (let i = 0; i < n/2; i++){ c[i] = Math.cos(2*Math.PI*i/n); s[i] = Math.sin(2*Math.PI*i/n); }
    const bits = Math.round(Math.log2(n));
    for (let i = 0; i < n; i++){ let x = i, y = 0; for (let b = 0; b < bits; b++){ y = (y << 1) | (x & 1); x >>= 1; } r[i] = y; }
    t = {c, s, r}; _tw.set(n, t);
  }
  return t;
}
function fft(re, im, inv){
  const n = re.length, t = _tables(n), r = t.r, c = t.c, s = t.s;
  for (let i = 0; i < n; i++){ const j = r[i]; if (j > i){ let a = re[i]; re[i] = re[j]; re[j] = a; a = im[i]; im[i] = im[j]; im[j] = a; } }
  for (let size = 2; size <= n; size <<= 1){
    const half = size >> 1, step = n / size;
    for (let i = 0; i < n; i += size){
      for (let j = 0, k = 0; j < half; j++, k += step){
        const wr = c[k], wi = inv ? s[k] : -s[k];
        const a = i + j, b = a + half;
        const xr = re[b]*wr - im[b]*wi, xi = re[b]*wi + im[b]*wr;
        re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
      }
    }
  }
  if (inv){ for (let i = 0; i < n; i++){ re[i] /= n; im[i] /= n; } }
}

/* ---------- 固定シードの乱数（毎回同じ雑音を再現） ---------- */
function mulberry32(a){
  return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const _nz = new Map();
function noiseSeq(seed){            // 分散1の複素ガウス雑音（I, Q それぞれ分散 1/2）
  let z = _nz.get(seed);
  if (!z){
    const rnd = mulberry32(20081 + 7919 * seed), re = new Float64Array(L), im = new Float64Array(L);
    for (let n = 0; n < L; n++){
      const u1 = Math.max(rnd(), 1e-12), u2 = rnd(), m = Math.sqrt(-Math.log(u1));
      re[n] = m * Math.cos(2*Math.PI*u2); im[n] = m * Math.sin(2*Math.PI*u2);
    }
    z = {re, im}; _nz.set(seed, z);
  }
  return z;
}

/* ---------- 送信波形（複素包絡） ---------- */
function makeWave(kind, Tus, Bmhz, codeLen){
  let N = Math.max(2, Math.round(Tus * 1e-6 * FS));
  const w = {kind};
  if (kind === 'barker'){
    const code = BARKER[codeLen || 13], nc = code.length, chip = Math.max(1, Math.round(N / nc));
    N = chip * nc; w.chip = chip; w.code = code; w.nc = nc; w.Beq = FS / chip; w.TB = nc;
    w.at = t => [code.charAt(Math.min(nc - 1, Math.max(0, Math.floor(t * FS / chip + 1e-7)))) === '1' ? 1 : -1, 0];
  } else if (kind === 'lfm'){
    const T = N / FS, al = Bmhz * 1e6 / T;       // アップチャープ：傾き α = +B/T
    w.alpha = al; w.Beq = Bmhz * 1e6; w.TB = T * w.Beq;
    w.at = t => { const d = t - T/2, p = Math.PI * al * d * d; return [Math.cos(p), Math.sin(p)]; };
  } else {
    w.Beq = FS / N; w.TB = 1;
    w.at = t => [1, 0];
  }
  w.N = N; w.T = N / FS; w.re = new Float64Array(N); w.im = new Float64Array(N);
  for (let n = 0; n < N; n++){ const v = w.at(n / FS); w.re[n] = v[0]; w.im[n] = v[1]; }
  return w;
}

/* ---------- テイラー重み付け W(f)（式8.10、帯域外は0） ---------- */
function taylorAt(f, B){
  if (Math.abs(f) > B/2 * (1 + 1e-9)) return 0;
  let g = 1; for (let m = 0; m < TAYLOR.length; m++) g += 2 * TAYLOR[m] * Math.cos(2*Math.PI*(m+1)*f/B);
  return g;
}
const binFreq = (k, n) => (k < n/2 ? k : k - n) * FS / n;

/* ---------- 目標 ---------- */
function getTargets(){
  const t = [{R: S.r1 * 1000, A: db2a(S.a1), ph: 0, name: '目標1'}];
  if (S.t2) t.push({R: S.r1 * 1000 + S.dr, A: db2a(S.a2), ph: Math.PI/2, name: '目標2'});
  return t;
}

/* ---------- 受信信号の生成 ----------
   エコー = A·u(t−td)·exp(j2πfd(t−td))（式8.41の形。搬送波位相は目標ごとの定数 ph とした） */
function makeScene(w, o){
  o = o || {};
  const re = new Float64Array(L), im = new Float64Array(L);
  const fd = (o.fd !== undefined ? o.fd : S.fd * 1e3);
  for (const tg of (o.targets || getTargets())){
    const td = 2 * tg.R / C, n0 = Math.max(0, Math.ceil(td * FS - 1e-7));
    const cp = Math.cos(tg.ph), sp = Math.sin(tg.ph);
    for (let n = n0; n < L; n++){
      const t = Math.max(0, n / FS - td);
      if (t >= w.T - 1e-12) break;
      const u = w.at(t), d = 2*Math.PI*fd*t, cr = Math.cos(d), ci = Math.sin(d);
      const xr = u[0]*cr - u[1]*ci, xi = u[0]*ci + u[1]*cr;
      re[n] += tg.A * (xr*cp - xi*sp); im[n] += tg.A * (xr*sp + xi*cp);
    }
  }
  if (o.noise){
    const sg = Math.pow(10, -S.snr / 20), z = noiseSeq(S.seed);
    for (let n = 0; n < L; n++){ re[n] += sg * z.re[n]; im[n] += sg * z.im[n]; }
  }
  if (o.eclipse){ for (let n = 0; n < w.N && n < L; n++){ re[n] = 0; im[n] = 0; } }   // 送信中は受信機オフ
  return {re, im};
}

/* ---------- パルス圧縮（周波数領域で実行） ----------
   y[m] = (1/N) Σ r[n+m]·u*[n]。wt='taylor' なら整合フィルタの後に W(f) を掛ける。
   up>1 のときはスペクトルにゼロを詰めて up 倍に補間する（表示・計測用） */
function compress(sc, w, wt, up){
  up = up || 1;
  const ar = new Float64Array(NF), ai = new Float64Array(NF), ur = new Float64Array(NF), ui = new Float64Array(NF);
  ar.set(sc.re); ai.set(sc.im); ur.set(w.re); ui.set(w.im);
  fft(ar, ai); fft(ur, ui);
  const M = NF * up, yr = new Float64Array(M), yi = new Float64Array(M), E = w.N;
  for (let k = 0; k < NF; k++){
    let pr = (ar[k]*ur[k] + ai[k]*ui[k]) / E, pi = (ai[k]*ur[k] - ar[k]*ui[k]) / E;
    if (wt === 'taylor'){ const g = taylorAt(binFreq(k, NF), w.Beq); pr *= g; pi *= g; }
    const kk = k < NF/2 ? k : k + M - NF; yr[kk] = pr; yi[kk] = pi;
  }
  fft(yr, yi, true);
  const n = L * up, mag = new Float64Array(n);
  for (let i = 0; i < n; i++){ yr[i] *= up; yi[i] *= up; mag[i] = Math.hypot(yr[i], yi[i]); }
  return {re: yr, im: yi, mag, n, dt: 1 / (FS * up), up};
}

/* 時間領域の相関（ステップ10の比較用）：定義どおりに掛けて足す */
function correlateDirect(sc, w){
  const N = w.N, yr = new Float64Array(L), yi = new Float64Array(L), mag = new Float64Array(L);
  for (let m = 0; m < L; m++){
    let sr = 0, si = 0; const nmax = Math.min(N, L - m);
    for (let n = 0; n < nmax; n++){ const a = sc.re[m+n], b = sc.im[m+n], c = w.re[n], d = w.im[n]; sr += a*c + b*d; si += b*c - a*d; }
    yr[m] = sr / N; yi[m] = si / N; mag[m] = Math.hypot(yr[m], yi[m]);
  }
  return {re: yr, im: yi, mag, n: L, dt: 1 / FS, up: 1};
}

/* ---------- 単一目標の応答（雑音なしの解析用） ----------
   ずれ量 τ=0 を中心に ±T の範囲。LFM は8倍補間、矩形チップの波形は補間なし。
   lost：先頭の lost サンプルが受信できなかった場合（エクリプシング） */
const NA0 = 4096;
function response(w, fdHz, wt, lost){
  fdHz = fdHz || 0; lost = lost || 0;
  const up = w.kind === 'lfm' ? 8 : 1, N = w.N;
  let NA = NA0; while (NA < 2*N + 2) NA *= 2;
  const ar = new Float64Array(NA), ai = new Float64Array(NA), ur = new Float64Array(NA), ui = new Float64Array(NA);
  for (let n = 0; n < N; n++){
    ur[n] = w.re[n]; ui[n] = w.im[n];
    if (n < lost) continue;
    const d = 2*Math.PI*fdHz*n/FS, c = Math.cos(d), s = Math.sin(d);
    ar[n] = w.re[n]*c - w.im[n]*s; ai[n] = w.re[n]*s + w.im[n]*c;
  }
  fft(ar, ai); fft(ur, ui);
  const M = NA * up, yr = new Float64Array(M), yi = new Float64Array(M);
  let eAll = 0, eW = 0, eW2 = 0;
  for (let k = 0; k < NA; k++){
    const p = ur[k]*ur[k] + ui[k]*ui[k]; eAll += p;
    let pr = (ar[k]*ur[k] + ai[k]*ui[k]) / N, pi = (ai[k]*ur[k] - ar[k]*ui[k]) / N;
    if (wt === 'taylor'){ const g = taylorAt(binFreq(k, NA), w.Beq); pr *= g; pi *= g; eW += p*g; eW2 += p*g*g; }
    const kk = k < NA/2 ? k : k + M - NA; yr[kk] = pr; yi[kk] = pi;
  }
  fft(yr, yi, true);
  const half = N * up, n = 2*half + 1, mag = new Float64Array(n);
  for (let j = -half; j <= half; j++){ const i = (j + M) % M; mag[j + half] = Math.hypot(yr[i], yi[i]) * up; }
  /* ミスマッチ損失（式8.46）：整合フィルタのS/N ÷ 重み付け後のS/N */
  const lossDb = wt === 'taylor' ? 10 * Math.log10(eAll * eW2 / (eW * eW)) : 0;
  return {x0: -N / FS, dx: 1 / (FS * up), mag, n, up, lossDb};
}

/* 式(8.11)：テイラー重み付け後の圧縮パルス（TB≫1の理論形）。x = B·t */
const sinc = x => Math.abs(x) < 1e-9 ? 1 : Math.sin(Math.PI*x) / (Math.PI*x);
function taylorTheory(x){
  let y = sinc(x); for (let m = 0; m < TAYLOR.length; m++) y += TAYLOR[m] * (sinc(x + m + 1) + sinc(x - m - 1));
  return Math.abs(y);
}
function theoryResp(fn, xmax, dx){   // 一様グリッド上の理論曲線を response() と同じ形で返す
  const half = Math.round(xmax / dx), n = 2*half + 1, mag = new Float64Array(n);
  for (let i = 0; i < n; i++) mag[i] = fn((i - half) * dx);
  return {x0: -half * dx, dx, mag, n};
}

/* ---------- 応答の計測：ピーク位置、3 dB幅・6 dB幅、ピークサイドローブ ---------- */
function metrics(r){
  const m = r.mag, n = r.n; let ip = 0;
  for (let i = 1; i < n; i++) if (m[i] > m[ip]) ip = i;
  const pk = m[ip];
  let a = ip, b = ip;
  while (a > 0 && m[a-1] < m[a]) a--;
  while (b < n-1 && m[b+1] < m[b]) b++;
  let sl = 0, isl = -1;
  for (let i = 0; i < n; i++){ if (i >= a && i <= b) continue; if (m[i] > sl){ sl = m[i]; isl = i; } }
  const cross = lv => {
    const th = pk * lv; let i = ip, j = ip;
    while (i > 0 && m[i] >= th) i--;
    while (j < n-1 && m[j] >= th) j++;
    const xl = (m[i] >= th) ? i : i + (th - m[i]) / (m[i+1] - m[i]);
    const xr = (m[j] >= th) ? j : j - (th - m[j]) / (m[j-1] - m[j]);
    return (xr - xl) * r.dx;
  };
  let off = 0;
  if (ip > 0 && ip < n-1){ const y0 = m[ip-1], y1 = m[ip], y2 = m[ip+1], den = y0 - 2*y1 + y2; if (Math.abs(den) > 1e-15) off = 0.5 * (y0 - y2) / den; }
  return {pk, tpk: r.x0 + (ip + off) * r.dx, w3: cross(Math.SQRT1_2), w6: cross(0.5),
          psl: sl > 0 ? db(sl / pk) : -Infinity, tsl: isl >= 0 ? r.x0 + isl * r.dx : NaN};
}

/* ---------- ストレッチ処理（LFM、送受の傾きが等しい場合） ----------
   受信信号に参照LFM（遅延 tauR、長さ 2T）の複素共役を掛け、FFTでスペクトル解析する */
function stretch(sc, w, tauR){
  const T = w.T, al = w.alpha, n0 = Math.max(0, Math.round((tauR - T/2) * FS)), len = Math.min(2 * w.N, L - n0);
  const NS = 8192, zr = new Float64Array(NS), zi = new Float64Array(NS), dr = new Float64Array(len);
  for (let i = 0; i < len; i++){
    const n = n0 + i, d = n / FS - tauR - T/2, p = Math.PI * al * d * d, c = Math.cos(p), s = Math.sin(p);
    zr[i] = sc.re[n]*c + sc.im[n]*s; zi[i] = sc.im[n]*c - sc.re[n]*s; dr[i] = zr[i];
  }
  fft(zr, zi);
  const mag = new Float64Array(NS);                  // 周波数の昇順（−fs/2 〜 +fs/2）に並べ替え
  for (let k = 0; k < NS; k++){ const kk = (k + NS/2) % NS; mag[k] = Math.hypot(zr[kk], zi[kk]) / w.N; }
  return {mag, f0: -FS/2, df: FS / NS, n: NS, dechirpRe: dr, t0: n0 / FS, len};
}

/* ============================================================
   ハンドブック記載値との照合（設定スライダーとは独立した固定条件で計算）
   ============================================================ */
function runChecks(){
  const out = [];
  const add = (item, cond, meas, ref, unit, tol, src, note) => out.push({item, cond, meas, ref, unit, tol, src, note: note || '',
    ok: tol === null ? null : Math.abs(meas - ref) <= tol});
  /* 1) LFM 重みなし（TB=400） */
  const w1 = makeWave('lfm', 100, 4), B1 = 4e6;
  const m1 = metrics(response(w1, 0, 'none'));
  add('LFM 重み付けなし：ピークサイドローブ', 'T=100 µs, B=4 MHz（TB=400）', m1.psl, -13.2, 'dB', 0.2, '表8.2, p.8.3');
  add('LFM 重み付けなし：3 dB幅 × B', '同上', m1.w3 * B1, 0.886, '', 0.01, '表8.1・表8.2');
  add('LFM 重み付けなし：6 dB幅 × B', '同上', m1.w6 * B1, 1.21, '', 0.01, '表8.2');
  /* 2) テイラー重み付け（TB=400） */
  const r2 = response(w1, 0, 'taylor'), m2 = metrics(r2);
  add('テイラー：ピークサイドローブ', 'T=100 µs, B=4 MHz（TB=400）', m2.psl, -40, 'dB', 1.0, '表8.2, p.8.8', 'TBが有限であるため約2 dB高い（下の TB=3200 の行と式8.11の行を参照）');
  add('テイラー：3 dB幅 × B', '同上', m2.w3 * B1, 1.25, '', 0.02, '表8.2');
  add('テイラー：6 dB幅 × B', '同上', m2.w6 * B1, 1.73, '', 0.02, '表8.2');
  add('テイラー：ミスマッチ損失', '同上', r2.lossDb, 1.15, 'dB', 0.03, '表8.2, p.8.3');
  const m2b = metrics(response(makeWave('lfm', 800, 4), 0, 'taylor'));
  add('テイラー：ピークサイドローブ', 'T=800 µs, B=4 MHz（TB=3200、スライダーの範囲外の確認用）', m2b.psl, -40, 'dB', 1.0, '表8.2, p.8.8', 'TBを大きくすると −40 dB に近づく');
  /* 2b) 式(8.11)・式(8.12) を直接評価（TB→∞ の理論値） */
  const mt = metrics(theoryResp(taylorTheory, 40, 0.002));
  add('式(8.11) の理論曲線：ピークサイドローブ', 'TB≫1 の理論式', mt.psl, -40, 'dB', 0.3, '式8.11, 表8.2');
  add('式(8.11) の理論曲線：3 dB幅 × B', '同上', mt.w3, 1.25, '', 0.01, '式8.11, 表8.2');
  add('式(8.11) の理論曲線：6 dB幅 × B', '同上', mt.w6, 1.73, '', 0.01, '式8.11, 表8.2');
  let s2 = 0; for (const F of TAYLOR) s2 += F*F;
  add('式(8.12) のミスマッチ損失', '係数 F1〜F5 から計算', 10*Math.log10(1 + 2*s2), 1.15, 'dB', 0.01, '式8.12, 表8.2');
  /* 3) バーカー13 */
  const mb = metrics(response(makeWave('barker', 13, 0, 13), 0, 'none'));
  add('バーカー13：ピークサイドローブ', 'T=13 µs（1チップ=10サンプル）', mb.psl, -20*Math.log10(13), 'dB', 0.05, '−20 log N, p.8.17');
  const mb2 = metrics(response(makeWave('barker', 40, 0, 13), 0, 'none'));
  add('バーカー13：ピークサイドローブ', 'T=40 µs 設定（実効 40.3 µs）', mb2.psl, -20*Math.log10(13), 'dB', 0.05, '−20 log N, p.8.17');
  /* 4) 距離ドップラ結合：ピーク位置のずれ t = −fd·T/B */
  const dop = (T, B, fdk, tol, note) => {
    const w = makeWave('lfm', T, B), m = metrics(response(w, fdk * 1e3, 'none'));
    add('LFM：ドップラ偏移によるピーク位置の変化', 'T=' + T + ' µs, B=' + B + ' MHz, fd=' + fdk + ' kHz', m.tpk * 1e6, -fdk * 1e3 * (T * 1e-6) / (B * 1e6) * 1e6, 'µs', tol, '−fd·T/B, p.8.4', note);
  };
  dop(40, 2, 100, 0.02);
  dop(100, 4, 200, 0.02);
  dop(100, 1, 500, 0.6, 'ハンドブックの例（50 µs, p.8.6）');
  dop(10, 1, 500, 0.3, 'ハンドブックの例（5 µs, p.8.5）。TB=10');
  /* 4b) ドップラがあるときのピーク低下（式8.9）：1 − |fd|/B */
  const m4 = metrics(response(makeWave('lfm', 40, 2), 2e5, 'none'));
  add('LFM：fd=B/10 の場合のピークの低下', 'T=40 µs, B=2 MHz, fd=200 kHz', db(m4.pk), db(0.9), 'dB', 0.1, '式8.9 から 1−|fd|/B');
  /* 5) ストレッチ処理：周波数オフセット δf = −(B/T)·td（式8.24）と 6 dB幅 1.21/T（式8.32） */
  {
    const w = makeWave('lfm', 40, 2), R0 = 20000, dR = 300, tauR = 2*R0/C;
    const st = stretch(makeScene(w, {fd: 0, targets: [{R: R0 + dR, A: 1, ph: 0}]}), w, tauR);
    const m = metrics({x0: st.f0, dx: st.df, mag: st.mag, n: st.n});
    add('ストレッチ：周波数オフセット', 'T=40 µs, B=2 MHz, 参照波形より 300 m（2 µs）遠い目標', m.tpk / 1e3, -(2e6/40e-6) * (2*dR/C) / 1e3, 'kHz', 1.0, '式8.24, p.8.31');
    add('ストレッチ：6 dB幅 × T', '同上（矩形窓）', m.w6 * 40e-6, 1.21, '', 0.02, '式8.32, p.8.34');
  }
  /* 参考：TBが小さいと表の値からずれる */
  const ms = metrics(response(makeWave('lfm', 10, 1), 0, 'none'));
  add('（参考）LFM 重み付けなし：ピークサイドローブ', 'T=10 µs, B=1 MHz（TB=10）', ms.psl, -13.2, 'dB', null, '表8.2 は TB≫1 が前提', 'TBが小さいために一致しない例');
  const mst = metrics(response(makeWave('lfm', 10, 1), 0, 'taylor'));
  add('（参考）テイラー：ピークサイドローブ', 'T=10 µs, B=1 MHz（TB=10）', mst.psl, -40, 'dB', null, 'p.8.8（フレネルリップル）', 'TBが小さいために一致しない例');
  const md = metrics(response(makeWave('lfm', 40, 2), 0, 'taylor'));
  add('（参考）テイラー：ピークサイドローブ', '初期設定 T=40 µs, B=2 MHz（TB=80）', md.psl, -40, 'dB', null, 'p.8.8（フレネルリップル）', 'TB=80 での値');
  return out;
}
if (typeof module !== 'undefined') module.exports = {FS, C, L, S, makeWave, makeScene, compress, correlateDirect, response, metrics, runChecks, stretch, taylorTheory, theoryResp, noiseSeq, db, fft};

/* ============================================================
   画面まわりの共通部品
   ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);

function fx(v, d){ if (!isFinite(v)) return '—'; const s = Math.abs(v).toFixed(d); return (v < 0 && Number(s) !== 0 ? MINUS : '') + s; }
const H = '<span class="hosoku">補足</span>';
let HLKEY = null;
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function toDb(mag, ref){ const o = new Float64Array(mag.length), r = ref || 1; for (let i = 0; i < mag.length; i++) o[i] = 20 * Math.log10(Math.max(mag[i] / r, 1e-7)); return o; }
function maxIn(arr, i0, i1){ let m = 0; i0 = Math.max(0, i0 | 0); i1 = Math.min(arr.length - 1, i1 | 0); for (let i = i0; i <= i1; i++) if (arr[i] > m) m = arr[i]; return m; }

/* ---------- canvas グラフ ---------- */
const PLOTS = [];
function niceStep(span, target){
  const raw = span / Math.max(1, target), p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;

function tickFmt(step){ const d = Math.max(0, -Math.floor(Math.log10(step) + 1e-9)); return v => fx(v, Math.min(d, 6)); }
class Plot {
  constructor(host, o){

    host.appendChild(this.root);

    this.cv = this.box.children[0]; this.ov = this.box.children[1]; this.tip = this.box.children[2];

    const X = v => m.l + (v - xr[0]) / (xr[1] - xr[0]) * pw, Y = v => m.t + (1 - (v - yr[0]) / (yr[1] - yr[0])) * ph;

    const cText = cssv('--text2'), cMuted = cssv('--muted'), cGrid = cssv('--grid'), cAxis = cssv('--axis');

];
/* 前提知識の補足（30秒で読める長さ。すべてハンドブックにない一般知識＝補足） */
const PREQ = {
  db: ['dB（デシベル）とは', '大きさの比を掛け算ではなく足し算で扱うための単位です。電力が 10 倍なら +10 dB、100 倍なら +20 dB、1/2 なら約 −3 dB、1/100 なら −20 dB。レーダでは信号の強さが何桁も変わるので、グラフの縦軸によく使います。このシリーズでは dB の値の横に「何倍か」も書きます。'],
  iq: ['I/Q（複素信号）とは', '受信した波の「強さ（振幅）」と「タイミング（位相）」を同時に表す方法です。平面の上に矢印を描き、矢印の長さが振幅、向きが位相です。横方向の成分を I、縦方向の成分を Q と呼びます。矢印がぐるぐる回る速さが、周波数にあたります。'],
  dop: ['ドップラとは', '救急車が近づくとサイレンが高く聞こえるのと同じで、近づく目標からのエコーは周波数が少し高くなります。このずれがドップラ周波数で、fd = 2v/λ（v は近づく速度、λ は波長）。波長 3 cm で 15 m/s なら 1 kHz です。'],
  prob: ['確率分布とは', '雑音の大きさは毎回ばらばらで、予測できません。ただし「どのくらいの大きさが、どのくらいの割合で出るか」は決まっています。これを表したグラフが確率分布で、横軸が大きさ、縦軸が出やすさです。ある値より右側の面積が、「その値を超える確率」になります。'],
  wave: ['パルスとエコー、距離の測り方', 'レーダは短い電波（パルス）を出し、目標からはね返ってきた電波（エコー）を受けます。往復にかかった時間 t から、距離 R = c·t/2（c は光の速さ）が分かります。1 マイクロ秒の遅れが 150 m にあたります。'],
  fft: ['周波数に分ける（スペクトル）とは', 'どんな信号もいろいろな周波数の波の足し合わせとして表せます。「どの周波数の成分が、どのくらい入っているか」を表したものがスペクトルで、それを計算する方法が FFT です。'],
  prf: ['パルスの繰り返しと PRF', 'レーダはパルスを一定の間隔で何度も送ります。1 秒あたりの回数が PRF です。同じ目標のエコーを、パルスごとに 1 つずつ受けることになり、その「パルスごとの変化」を見るのが MTI やパルスドップラです。']
};

/* ============================================================
   4本共通の進行部品：問い → 予想 → 操作 → 答え合わせ、ミッション、読み物、用語集、指導者メモ
   各回のファイルで STEPS（ステップの定義）、CT（操作部の一覧）、PRE（前提知識）、resetS(init) を用意する
   ============================================================ */
const STATE = {pred: [], shown: [], ms: [], touched: false};
let cur = 0, PL = [], playT = null, hlT = null, lastR = {};
/* dB の値に「何倍か」を添える（電力の比）。例：−20.0 dB（電力 1/100） */
function ratioTxt(d){ const r = Math.pow(10, Math.abs(d) / 10), s = r >= 9950 ? fx(r / 1e4, r >= 99500 ? 0 : 1) + ' 万' : r >= 99.5 ? fx(r, 0) : r >= 9.95 ? fx(r, 0) : fx(r, 1); return Math.abs(d) < 0.05 ? '1 倍' : d > 0 ? s + ' 倍' : '1/' + s; }
function dbx(d, dg){ return isFinite(d) ? fx(d, dg === undefined ? 1 : dg) + ' dB（電力 ' + ratioTxt(d) + '）' : '—'; }
/* 読み物の書き方：[[キー|表示]] はシミュレータ側を強調するリンク、{H} は「補足」の印 */
function rt(s){ return String(s || '').replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, '<a class="term" data-hl="$1" role="button" tabindex="0">$2</a>').replace(/\{H\}/g, H); }
function tilesHtml(a){ return (a || []).filter(Boolean).map(t => '<div class="tile"><div class="k">' + t.k + '</div><div class="v">' + t.v + '</div>' + (t.s ? '<div class="s">' + t.s + '</div>' : '') + '</div>').join(''); }
const eq = b => '<div class="eq">' + b + '</div>';

function stopPlay(){ if (playT){ clearInterval(playT); playT = null; const b = $('#playBtn'); if (b) b.textContent = b.dataset.t; } }
function ctlDef(c){ const o = typeof c === 'string' ? {k: c} : c; return Object.assign({}, CT[o.k], o); }
function getV(d){ return d.get ? d.get() : S[d.k]; }
function setV(d, v){ if (d.set) d.set(v); else S[d.k] = v; }
function buildCtl(host, c){
  const d = ctlDef(c), e = el('div', 'ctl'); e.dataset.k = d.k;
  if (d.seg){
    e.innerHTML = '<div class="ctl-h"><label>' + d.l + '</label></div><span class="seg">' + d.seg.map(o => '<button type="button" data-v="' + o[0] + '">' + o[1] + '</button>').join('') + '</span><small></small>';
    $('.seg', e).addEventListener('click', ev => { const v = ev.target && ev.target.dataset ? ev.target.dataset.v : undefined; if (v !== undefined){ setV(d, typeof d.seg[0][0] === 'number' ? Number(v) : v); userChanged(); } });
  } else if (d.chk){
    e.innerHTML = '<label class="chk"><input type="checkbox">' + d.l + '</label><small></small>';
    $('input', e).addEventListener('change', ev => { setV(d, ev.target.checked); userChanged(); });
  } else {
    e.innerHTML = '<div class="ctl-h"><label>' + d.l + '</label><output></output></div><input type="range" min="' + d.min + '" max="' + d.max + '" step="' + d.step + '" aria-label="' + d.l.replace(/<[^>]*>/g, '') + '"><small></small>';
    $('input', e).addEventListener('input', ev => { setV(d, parseFloat(ev.target.value)); userChanged(); });
  }
  e._d = d; host.appendChild(e);
}
function syncCtl(){
  for (const e of document.querySelectorAll('#sim .ctl')){
    const d = e._d, v = getV(d);
    if (d.seg){ for (const b of $('.seg', e).children) b.setAttribute('aria-pressed', String(b.dataset.v) === String(v)); }
    else if (d.chk) $('input', e).checked = !!v;
    else { $('input', e).value = v; $('output', e).textContent = d.f ? d.f(v) : String(v); }
    $('small', e).textContent = d.h ? d.h(v) : '';
  }
  const fx_ = $('#fixed'), st = STEPS[cur];
  if (fx_) fx_.innerHTML = ((st.fixed && st.fixed.length) || (st.fixT && st.fixT.length) ? 'このステップでは固定：' + (st.fixed || []).map(k => { const d = ctlDef(k), v = getV(d); return '<span>' + d.l.replace(/（.*?）/g, '') + ' ' + (d.seg ? (d.seg.find(o => String(o[0]) === String(v)) || ['', v])[1] : d.chk ? (v ? 'あり' : 'なし') : d.f ? d.f(v) : v) + '</span>'; }).join('') + (st.fixT || []).map(t => '<span>' + t + '</span>').join('') : '');
}
function userChanged(){ STATE.touched = true; redraw(); }
function redraw(){
  const st = STEPS[cur]; syncCtl();
  lastR = st.draw(PL) || {};
  const tl = $('#tiles'); if (tl) tl.innerHTML = tilesHtml(lastR.tiles);
  if (st.mission && !STATE.ms[cur] && STATE.touched && ((st.free && !st.q) || STATE.pred[cur] !== undefined) && st.mission.ok(lastR)){ STATE.ms[cur] = true; }
  showMission();
}
function showMission(){
  const st = STEPS[cur], c = $('#msCard');
  if (c){ c.classList.toggle('done', !!STATE.ms[cur]); $('.st', c).textContent = STATE.ms[cur] ? '達成！' : (lastR.msHint ? '未達成（' + lastR.msHint + '）' : '未達成'); }
  const bar = $('#msbar'); let n = 0, h = 'ミッション ';
  STEPS.forEach((s, i) => { if (!s.mission) return; if (STATE.ms[i]) n++; h += '<button type="button" data-i="' + i + '" class="' + (STATE.ms[i] ? 'done' : '') + '" title="ステップ ' + (i + 1) + '：' + s.short + (STATE.ms[i] ? '（達成）' : '') + '" aria-label="ステップ ' + (i + 1) + ' のミッション' + (STATE.ms[i] ? '（達成）' : '（未達成）') + '">✓</button>'; });
  bar.innerHTML = h + '<b>' + n + ' / ' + STEPS.filter(s => s.mission).length + '</b>';
  for (const b of $('#steps').children) b.classList.toggle('done', !!STATE.ms[Number(b.dataset.i)]);
}
function showAnswer(){
  const st = STEPS[cur], body = $('#ansBody'), p = STATE.pred[cur]; if (!body || !STATE.shown[cur]) return;
  body.hidden = false;
  body.innerHTML = '<p><b>' + (p === st.ans ? '予想どおりです。' : '予想とは異なりました。ここで理由を確かめることが、理解につながります。') + '</b></p><p>答え：<b>' + st.ch[st.ans] + '</b></p><p>' + rt(st.why) + '</p>';
  const bs = $('#choices').children; for (let i = 0; i < bs.length; i++) bs[i].classList.toggle('right', i === st.ans);
}
function renderRead(st, i){
  const r = st.read || {}; let h = '<h2><span class="num">ステップ ' + (i + 1) + ' / ' + STEPS.length + '</span>' + st.title + '</h2>';
  if (i === 0 && typeof PRE !== 'undefined'){
    h += '<div class="pre"><b>このシミュレータに必要な前提知識</b>　' + H + '（開くと、30 秒ほどで読める説明が表示されます）';
    for (const p of PRE){ if (typeof p === 'string') h += '<details><summary>' + PREQ[p][0] + '</summary><p>' + PREQ[p][1] + '</p></details>'; else h += '<p style="margin:6px 0 0;font-size:13px">' + p.t + '　<a href="' + SERIES[p.no].file + '#s' + p.step + '">第' + p.no + '回 ステップ ' + p.step + ' を先に確認してください</a></p>'; }
    h += '</div>';
  }

let gPop = null, gFrom = null;
function gClose(back){

  const r = gFrom.getBoundingClientRect(), dw = document.documentElement.clientWidth, pw = gPop.offsetWidth, ph = gPop.offsetHeight;
