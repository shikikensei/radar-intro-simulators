<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中級 第1回 検出の計算</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f2ee; --surface:#fcfcfb; --surface2:#f0efec; --border:#d9d8d2;
  --text:#0b0b0b; --text2:#52514e; --muted:#77766f; --grid:#e4e3dd; --axis:#a9a8a1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --ref:#8a8983; --hl:#b4279a;
  --band:rgba(42,120,214,.10); --band2:rgba(235,104,52,.12); --bandn:rgba(120,119,112,.14); --band3:rgba(27,175,122,.14);
  --accent:#1c5cab; --accent-bg:#e4eefb; --warn:#8a5a00; --warn-bg:#fdf1d3; --ok:#0a6b0a; --ok-bg:#e2f3e2; --ng:#b02a2a;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110; --surface:#1a1a19; --surface2:#242423; --border:#3a3a37;
  --text:#f0efec; --text2:#c3c2b7; --muted:#96958c; --grid:#2d2d2a; --axis:#6a6963;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ref:#96958c; --hl:#e56bd0;
  --band:rgba(57,135,229,.16); --band2:rgba(217,89,38,.18); --bandn:rgba(150,149,140,.16); --band3:rgba(25,158,112,.20);
  --accent:#86b6ef; --accent-bg:#1c2c44; --warn:#f0c869; --warn-bg:#3a2f12; --ok:#5fd05f; --ok-bg:#16301a; --ng:#f08a8a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.75;
  font-family:"Yu Gothic UI","Meiryo UI","Meiryo","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
header.top h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
#msbar{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:12px;color:var(--text2);overflow:hidden;white-space:nowrap}
#msbar button{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--axis);background:none;padding:0;cursor:pointer;font-size:10px;line-height:1;color:transparent;flex:none}
#msbar button.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
#msbar b{margin-left:6px;color:var(--text);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;line-height:1.4;white-space:nowrap;text-decoration:none;color:var(--text);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.sm{padding:2px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
nav#steps{display:flex;flex-wrap:wrap;gap:5px;max-width:1480px;margin:10px auto 0;padding:0 14px}
nav#steps button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:2px 10px 2px 3px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
nav#steps button i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--surface2);font-size:11.5px;font-weight:700}
nav#steps button[aria-current=true]{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:700}
nav#steps button[aria-current=true] i{background:var(--accent);color:var(--surface)}
nav#steps button.done i{background:var(--ok);color:var(--surface)}
.layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;max-width:1480px;margin:0 auto;padding:10px 40px 30px 14px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
#read,.card{background:var(--surface);border:1px solid var(--border);border-radius:10px}
#read{padding:12px 16px 14px;min-width:0}
#read h2{font-size:18px;margin:0 0 6px;line-height:1.4}
#read h2 .num{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-bg);border-radius:4px;padding:1px 8px;margin-right:8px;vertical-align:3px}
#read h3{font-size:13px;margin:12px 0 2px;color:var(--accent)}
#read p{margin:2px 0 6px}
#read a.term{color:var(--hl);font-weight:700;text-decoration:underline dotted;cursor:pointer}
.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:17px;margin:6px 0 4px 8px;overflow-x:auto;white-space:nowrap;padding:6px 10px;background:var(--surface2);border-radius:6px}
.eq i{font-style:italic}
.sym{font-size:12.5px;color:var(--text2)}
.mis{border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:0 8px 8px 0;padding:6px 12px;margin:4px 0}
.src{font-size:12px;color:var(--text2);border-top:1px dashed var(--border);padding-top:6px;margin-top:10px}
.hosoku{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--warn);color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 5px;margin:0 4px 0 0;line-height:1.5;vertical-align:1px;white-space:nowrap}
details{border:1px solid var(--border);border-radius:8px;padding:5px 10px;margin:8px 0 0;background:var(--surface)}
details summary{cursor:pointer;font-weight:700;font-size:12.5px}

.pre{border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin:6px 0 10px;background:var(--surface2)}
.pre>b{font-size:12.5px}

#sim{min-width:0;display:flex;flex-direction:column;gap:10px}
.card{padding:10px 14px}
.card .lbl{display:inline-block;font-size:11.5px;font-weight:700;color:var(--surface);background:var(--accent);border-radius:4px;padding:0 8px;margin-right:8px;line-height:1.6}
.card.q p{margin:4px 0 8px;font-size:15px;font-weight:700}
.ch{display:flex;flex-wrap:wrap;gap:6px}
.ch button{border:1.5px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;text-align:left;line-height:1.45}
.ch button:hover{border-color:var(--accent)}
.ch button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-bg);font-weight:700}
.ch button.right{border-color:var(--ok);background:var(--ok-bg)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.card.op{position:relative}
.card.op.locked>*:not(.lockmsg){opacity:.3;pointer-events:none;filter:grayscale(.4)}
.lockmsg{display:none;position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:3;background:var(--warn-bg);border:1.5px solid var(--warn);color:var(--warn);font-weight:700;border-radius:8px;padding:6px 16px;white-space:nowrap}
.card.op.locked .lockmsg{display:block}
.fixed{display:flex;flex-wrap:wrap;gap:5px;font-size:12px;color:var(--text2);margin-bottom:6px;align-items:center}
.fixed span{border:1px solid var(--border);border-radius:999px;padding:0 8px;background:var(--surface2);white-space:nowrap;line-height:1.7}
.ctls{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 14px;margin-bottom:6px}
.ctl{min-width:0;border-radius:6px;padding:2px 6px;border:2px solid transparent}
.ctl.flash,.tile.flash{border-color:var(--hl);background:color-mix(in srgb,var(--hl) 12%,transparent)}
.ctl-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 8px;min-width:0}
.ctl-h label{font-size:13px;font-weight:700;min-width:0;line-height:1.5}
.ctl-h output{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;color:var(--accent);margin-left:auto}
.ctl input[type=range]{display:block;width:100%;margin:1px 0 0;accent-color:var(--s1);height:18px}
.ctl small{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.ctl .chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer}
.ctl .chk input{accent-color:var(--s1);margin:0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{border:0;background:none;padding:2px 10px;cursor:pointer;font-size:12.5px;border-left:1px solid var(--border);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--accent-bg);color:var(--accent);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.plotgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.plot{min-width:0;border:1px solid var(--border);border-radius:8px;padding:5px 8px 2px;background:var(--surface)}
.plot-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 14px;min-height:20px}
.plot-t{font-size:12.5px;font-weight:700}
.plot-lg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--text2)}
.plot-lg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.plot-lg i{display:inline-block;width:20px;height:0;border-top:2px solid}
.plot-c{position:relative;width:100%}
.plot-c canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.plot-c canvas.ov{cursor:crosshair}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:11.5px;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,.18);white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums}
.tip b{display:block}
.tip i{display:inline-block;width:12px;height:0;border-top:2px solid;margin-right:5px;vertical-align:middle}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin-top:8px}
.tile{border:2px solid var(--border);border-radius:8px;padding:4px 10px;min-width:0;background:var(--surface)}
.tile .k{font-size:11.5px;color:var(--text2);line-height:1.4}
.tile .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35;overflow-wrap:anywhere}
.tile .v small{font-size:12px;font-weight:600;color:var(--text2)}
.tile .s{font-size:11px;color:var(--muted);line-height:1.4;overflow-wrap:anywhere}
.card.ms{border-left:5px solid var(--s2)}
.card.ms.done{border-left-color:var(--ok);background:var(--ok-bg)}
.card.ms p{margin:4px 0 2px}
.card.ms .st{font-weight:700;color:var(--muted)}
.card.ms.done .st{color:var(--ok)}
.card.ans .body{margin-top:8px}
.card.ans .body p{margin:3px 0}
.stepnav{display:flex;justify-content:space-between;gap:8px;max-width:1480px;margin:0 auto;padding:0 14px 30px}
#gloss{position:fixed;right:0;top:0;bottom:0;width:min(400px,92vw);z-index:40;background:var(--surface);border-left:1px solid var(--border);box-shadow:-4px 0 18px rgba(0,0,0,.2);padding:12px 16px;overflow-y:auto}
#gloss h2{font-size:15px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
#gloss h3{font-size:12.5px;margin:12px 0 2px;color:var(--accent);border-bottom:1px solid var(--border)}
#gloss dt{font-weight:700;margin-top:7px;font-size:13px}
#gloss dd{margin:0;font-size:13px;color:var(--text2);line-height:1.6}
#gloss input{width:100%;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
#glTab{position:fixed;right:0;top:45%;z-index:35;writing-mode:vertical-rl;border:1px solid var(--border);border-right:0;border-radius:8px 0 0 8px;background:var(--accent-bg);color:var(--accent);font-weight:700;padding:10px 4px;cursor:pointer;letter-spacing:.1em}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0}
table.t th,table.t td{border-bottom:1px solid var(--border);padding:4px 8px;text-align:left;vertical-align:top}
table.t th{color:var(--text2);font-weight:700;background:var(--surface2);white-space:nowrap}
.tw{overflow-x:auto}
.ok{color:var(--ok);font-weight:700;white-space:nowrap}.ng{color:var(--ng);font-weight:700;white-space:nowrap}.info{color:var(--muted);white-space:nowrap}
@media print{nav#steps,.stepnav,header.top .btn,#glTab{display:none}}
.nextsim{margin:14px 0 4px;font-size:14px}
.card.q .qm p{margin:4px 0 6px;font-size:14px;font-weight:400}
.card.q .qm p:first-child{font-size:15px;font-weight:700}
.asks{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0 10px}
.ask{display:flex;flex-direction:column;gap:2px;min-width:0}
.ask .al{font-size:13px;font-weight:700}
.ask .ai{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.ask input{width:112px;font:inherit;font-size:16px;font-weight:700;padding:3px 8px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);text-align:right}
.ask input:focus{outline:2px solid var(--accent);outline-offset:1px}
.ask input.good{border-color:var(--ok);background:var(--ok-bg)}
.ask input.bad{border-color:var(--warn);background:var(--warn-bg)}
.ask .au{font-size:13px}
.ask small{font-size:11.5px;color:var(--muted)}
.card.q .fb p{margin:6px 0 0;font-size:13.5px;font-weight:400}
.fb .okline{color:var(--ok)}
.fb .hintline{border-left:3px solid var(--accent);padding-left:8px}
.card.sheetc{padding-bottom:6px}
table.t.sheet td.num{font-weight:700;white-space:nowrap}
table.t.sheet tr.now td{background:var(--accent-bg)}
table.t.sheet tr.yet td{color:var(--muted)}
table.t.sheet tr.yet td.num{font-weight:400}
table.t.sheet tr.sh td{font-weight:700;color:var(--text2);background:var(--surface2)}
.card.ans .body p{margin:5px 0}
a.gt{color:inherit;text-decoration:underline dashed var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help;border-radius:3px}
a.gt::after{content:"?";font-size:.68em;font-weight:700;vertical-align:super;line-height:0;margin-left:1px;color:var(--accent)}
a.gt:hover,a.gt[aria-expanded=true]{background:var(--accent-bg)}
.gpop{position:absolute;z-index:38;width:min(340px,calc(100vw - 16px));background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.28);padding:8px 12px 10px;font-size:13px;font-weight:400;line-height:1.65;color:var(--text)}
.gpop:focus{outline:2px solid var(--accent);outline-offset:1px}
.gpop .gh{display:block;font-size:14px;font-weight:700;margin:0 0 2px}
.gpop p{margin:0 0 8px;color:var(--text2)}
.gpop .gpa{display:flex;flex-wrap:wrap;gap:6px}
#gloss dt.hit,#gloss dt.hit+dd{background:var(--accent-bg);box-shadow:-6px 0 0 var(--accent-bg),6px 0 0 var(--accent-bg)}
#gloss .glpage{margin:0 0 8px;font-size:12.5px}
</style>

<body>
<header class="top">
  <a class="btn sm" href="00_index.html" title="シリーズの目次へ">← 目次</a>
  <h1>中級 第1回 検出の計算</h1>
  <div id="msbar" title="ミッションの達成状況（丸を押すとそのステップへ）"></div>
  <button class="btn sm" id="glBtn" type="button">用語集</button>
  <button class="btn sm" id="themeBtn" type="button" title="ライト／ダーク表示を切り替える">表示: ライト</button>
</header>
<nav id="steps" aria-label="ステップ"></nav>
<div class="layout">
  <article id="read" aria-label="読み物"></article>
  <section id="sim" aria-label="シミュレータ"></section>
</div>
<div class="stepnav">
  <button class="btn" id="prevBtn" type="button">← 前のステップ</button>
  <button class="btn primary" id="nextBtn" type="button">次のステップ →</button>
</div>
<button id="glTab" type="button" aria-label="用語集を開く">用語集</button>
<aside id="gloss" hidden aria-label="用語集"></aside>
<script>
'use strict';
const SIM_NO = 101;
/* ============================================================
   第0回・第5回以降で共通に使う小さな道具
   ============================================================ */
const MINUS = '−';
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gaussGen(seed){ const r = mulberry32(seed); let sp = null; return function(){ if (sp !== null){ const v = sp; sp = null; return v; } const u = Math.sqrt(-2 * Math.log(1 - r())), a = 2 * Math.PI * r(); sp = u * Math.sin(a); return u * Math.cos(a); }; }
const db10 = v => 10 * Math.log10(v);
const SUPD = {'-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹'};
function sup(n){ return String(n).split('').map(c => SUPD[c] || c).join(''); }
function sci(v, d){ if (!(v === v)) return '—'; if (v === 0) return '0'; let e = Math.floor(Math.log10(Math.abs(v))), m = v / Math.pow(10, e); if (Math.abs(m) >= 9.95){ m /= 10; e++; } return fx(m, d === undefined ? 1 : d) + '×10' + sup(e); }
function wilson(k, n){ if (!n) return [0, 1]; const z = 1.96, p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d; return [k === 0 ? 0 : Math.max(0, c - h), k === n ? 1 : Math.min(1, c + h)]; }
function checkTable(R){
  const lab = {ok: '<span class="ok">一致</span>', info: '<span class="info">差あり</span>', ng: '<span class="ng">不一致</span>', ref: '<span class="info">参考</span>'};
  let h = '<h3>ハンドブックの値との照合</h3><p class="sym">「差あり」は条件の違いなどで差があるもの、「参考」はハンドブックに基準値のない確認です（理由は備考）。</p><div class="tw"><table class="t"><tr><th>項目</th><th>ハンドブック（基準）</th><th>このシミュレータ</th><th>判定</th><th>備考</th></tr>';
  for (const r of R) h += '<tr><td>' + r.item + '</td><td>' + r.ref + '</td><td>' + r.calc + '</td><td>' + lab[r.st] + '</td><td><small>' + r.note + '</small></td></tr>';
  return h + '</table></div>';
}
const near = (a, b, tol) => Math.abs(a - b) <= tol ? 'ok' : 'ng';

/* ============================================================
   中級 第1回 検出の計算（必要な S/N と探知距離を、自分で出す）：計算部分
   もとにした資料：Radar Handbook 3rd ed. 第4章 Pulse Doppler Radar §4.6 Range Performance（p.4.39–4.48）、式4.2 の記号の定義（§4.2、p.4.16）
                   第1章 §1.4（式1.5）→ 入門 第15回／第7章 §7.2（2 値積分）→ 入門 第4回
   方針：一般的な原理だけを扱う。例のレーダの値は、入門 第15回の基準のレーダを §4.6 の記号に直したもの（説明用。実在の装置の値ではない）。

   PDF のページを画像で見て確かめた式（記号は原本のまま）：
   式4.15  SNR = (Ro/R)^4
   式4.16  Ro = [ Pav·GT·GR·λ²·σT / ((4π)³·k·Ts·Bn·LT) ]^(1/4)      Ro：SNR が 1 になる距離。LT：目標にかかる損失
           Pav：平均送信電力、GT・GR：送信・受信の利得、λ：波長、k：ボルツマン定数、Ts：システム雑音温度、Bn：ドップラフィルタの帯域幅（式4.2 の下、p.4.16）
           SNR は、整合フィルタ・パルス圧縮・ドップラフィルタのあとの値（1 つの CPI についての値）。
   式4.17  エクリプシングとレンジゲートのストラドルの損失（近似）= 12N / (7N − 6)      N：IPP の中のレンジゲートの数。Pd が 0.5 に近いときだけ有効
   式4.18  PFA = (1/Nr)·[ Td·ln2 / ( C·Nf·NFM^(m−1)·TFR ) ]^(1/m)      1 ルック（m = n = 1）なら PFA = Td·ln2 / (Nr·Nf·TFR)
           TFR：誤報の時間（その時間内に 1 回以上の誤報が出る確率が 0.5）。TFR ≈ TAVG·ln2

  [5, '最近傍法（nearest neighbor）', '統計距離が最も小さい検出点と航跡の組から、順に割り当てていく方法です。対応付けの方法として最も広く使われています。', 'g-nearest-neighbor'],
  [5, 'GNN（global nearest neighbor）', '検出点と航跡の組合せの全体から、統計距離の合計などが最小になる割り当てを選ぶ方法です。', 'g-gnn'],
  [5, '平滑化と予測（filtering / prediction）', '平滑化は測定誤差の影響を抑えて現在の位置と速度を推定する処理です。予測は次の測定の時刻における位置を計算する処理です。', 'g-filtering-and-prediction'],
  [5, 'α-β フィルタ（α-β filter）', '予測値と測定値の差に、一定のゲイン（位置に α、速度に β）を掛けて推定値を修正する、最も簡単な追尾フィルタです。', 'g-alpha-beta-filter'],
  [5, '追尾ゲイン（tracking gain）', '予測値と測定値の差を、推定にどれだけ反映するかを決める係数です。大きいと測定値を小さいと予測値を重視することになります。', 'g-tracking-gain'],
  [5, '遅れ（lag、追従遅れ）', '目標が旋回や加速をしたときに、航跡が実際の位置に追従できずに生じる、バイアス性の誤差です。', 'g-lag'],
  [5, '機動（maneuver）', '目標が旋回や加減速によって、速度や進行方向を変えることです。', 'g-maneuver'],
  [5, 'カルマンフィルタ（Kalman filter）', '測定精度、測定の間隔、想定する機動の大きさから、追尾ゲインを毎回計算するフィルタです。α-β フィルタのゲインを自動的に変化させるものと考えることができます。', 'g-kalman-filter'],
  [5, '追尾指数（track filtering parameter）', '想定する機動の大きさ、測定の間隔、測定精度を 1 つにまとめた、単位のない数です。大きいほど追尾ゲインが大きくなります。', 'g-tracking-index'],
  [5, '航跡の開始（track initiation）', 'どの航跡にも対応しない検出点から、新しい航跡を生成する処理です。「5 回の機会のうち 4 回の検出」のような基準を使います。', 'g-track-initiation'],
  [5, '偽航跡（false track）', '目標ではないものに対して生成された航跡です。無関係な誤警報やクラッタが偶然並んで生じるものと、鳥のように対象としない物体に対して生じるものがあります。', 'g-false-track'],
  [5, 'アクティビティ制御（activity control）', '検出点が多すぎる領域で検出の条件を厳しくして、追尾処理に入力する検出点の数を抑える処理です。', 'g-activity-control'],
  [5, '多重仮説追尾（MHT、multiple hypothesis tracking）', '対応付けを 1 つに決定せず、複数の可能性（仮説）を並行して保持し、後の測定によって可能性の低いものを除いていく方法です。', 'g-mht'],
  [5, 'PDA／JPDA（probabilistic data association）', 'ゲート内の検出点を 1 つに絞らず、「その航跡のものである確率」で重み付けして、まとめて更新に使う方法です。', 'g-pda']
);
GLOSS.push(
  [6, 'AMTI（airborne MTI、航空機搭載 MTI）', '航空機に搭載したレーダで使う MTI です。レーダ自身が移動するため、地面のクラッタにもドップラ偏移が生じる点が、地上のレーダと異なります。', 'g-amti'],
  [6, 'プラットフォーム（platform）', 'レーダを搭載している移動体です。この教材では航空機を指します。', 'g-platform'],
  [6, '対地速度（ground speed）', '地面に対する機体の速度です。クラッタのドップラ周波数は、この速度で決まります。', 'g-ground-speed'],
  [6, 'ボアサイト（boresight）', 'アンテナのビームの中心の方向です。', 'g-boresight'],
  [6, '俯角（depression angle）', '水平から下向きに測った、見下ろす角度です。', 'g-depression-angle'],
  [6, 'スラントレンジ（slant range）', 'レーダから地面の点までの、斜めの直線距離です。', 'g-slant-range'],
  [6, 'プラットフォーム運動スペクトル（platform-motion spectrum）', '機体の移動のために、ビームの中の方向ごとにクラッタのドップラ周波数がわずかずつ異なり、その結果として幅をもつようになったクラッタのスペクトルです。真横を観測する場合に、幅が最大になります。', 'g-platform-motion-spectrum'],
  [6, 'TACCAR（time-averaged clutter coherent airborne radar）', 'クラッタのエコーの平均的なドップラ周波数を測定し、それが 0 になるように周波数を偏移させて、メインビームクラッタを MTI のノッチに合わせる方法です。', 'g-taccar'],
  [6, '位相中心（phase center）', 'アンテナが電波を送受信している見かけの 1 点です。開口の中での重み付けによって、位置を移動できます。', 'g-phase-center'],
  [6, 'DPCA（displaced phase center antenna）', 'パルスごとにアンテナの位相中心を移動して、機体が進んだ距離を打ち消し、クラッタから見てアンテナが静止しているようにする方法です。', 'g-dpca'],
  [6, '和パターンと差パターン（sum / difference pattern）', 'アンテナの左右半分の信号を、加算して形成するビーム（和パターン）と、減算して形成するビーム（差パターン）です。差パターンは中心で 0 になり、左右で符号が逆になります。', 'g-sum-and-difference-pattern'],
  [6, 'ステップ走査補償（step-scan compensation）', 'アンテナの回転によるエコーの振幅の変化を、差パターンを使って打ち消す方法です。ビームを電子的にわずかに前後へ向け、静止していたかのように見せます。', 'g-step-scan-compensation'],
  [6, 'CPCT（coincident phase center technique）', '位相中心を開口の前後にも移動して、進行方向の運動によるクラッタのスペクトル幅も打ち消す方法です。', 'g-cpct'],
  [6, 'STAP（space-time adaptive processing、時空間適応処理）', 'アンテナの素子ごと（空間）・パルスごと（時間）の信号を受信データから計算した係数で重み付けして加算し、クラッタや妨害を抑圧する処理です。', 'g-stap'],
  [6, '自由度（degrees of freedom）', '適応処理で自由に決められる係数の数です。素子数 × パルス数が上限になります。多いほど細かく抑圧できますが、計算量と必要なデータ量が増えます。', 'g-degrees-of-freedom']
);
GLOSS.push(
  [7, 'フェーズドアレイ（phased array）', '多数の素子を配列し、各素子の位相を制御することによって、アンテナを機械的に動かさずにビームを走査するアンテナです。', 'g-phased-array'],
  [7, '素子（radiating element、放射素子）', 'アレイを構成する 1 つ 1 つの小さなアンテナです。', 'g-radiating-element'],
  [7, '開口（aperture）', 'アンテナが電波を送受信する面です。直線アレイでは素子数 × 素子間隔が開口の長さになります。', 'g-aperture'],
  [7, 'アレイファクタ（array factor）', '等方性の素子を配列したと仮定した場合の、アレイ全体の放射パターンです。素子の配置と各素子の振幅・位相で決まります。', 'g-array-factor'],
  [7, '素子パターン（element pattern）', '素子 1 つの放射パターンです。アレイ全体のパターンは、素子パターンとアレイファクタの積になります。', 'g-element-pattern'],
  [7, '移相器（phase shifter）', '各素子の信号の位相を変える部品です。通常はデジタル制御であり、設定できる位相は量子化されています。', 'g-phase-shifter'],
  [7, 'ビーム走査（beam scanning）', 'ビームの方向を変えることです。フェーズドアレイでは、隣接する素子の間で位相を一定量ずつ変えることによって行います。', 'g-beam-scanning'],
  [7, 'グレーティングローブ（grating lobe）', '素子間隔が広い場合に、主ビームとは別の方向に生じる、主ビームと同程度の強度のビームです。', 'g-grating-lobe'],
  [7, '照射分布（illumination function）', '開口上の振幅の分布です。端の振幅を小さくするとサイドローブが下がり、ビーム幅が広くなります。', 'g-illumination-function'],
  [7, '開口効率（aperture efficiency）', '重み付けをした開口の利得を、同じ大きさの開口を一様に励振した場合の利得で割った値です。重み付けによってサイドローブを下げると 1 より小さくなります。', 'g-aperture-efficiency'],
  [7, '位相の量子化（phase quantization）', '移相器が一定のステップでしか位相を設定できないために生じる誤差です。', 'g-phase-quantization'],
  [7, '量子化ローブ（quantization lobe）', '位相や振幅の量子化誤差が規則的に並ぶことによって、特定の方向に現れる余分なローブです。', 'g-quantization-lobe'],
  [7, '開口充填時間（aperture fill time）', '斜め方向から到来する波が、開口の一端から他端まで到達するのに要する時間です。パルス幅がこれより十分に長くないと、開口の全体が同時に寄与しません。', 'g-aperture-fill-time'],
  [7, '時間遅延走査（time-delay scanning）', '位相ではなく時間遅延によってビームの方向を変える方法です。周波数が変わってもビームの方向が変わりません。', 'g-time-delay-scanning'],
  [7, 'サブアレイ（subarray）', 'アレイの素子をいくつかずつまとめた小さなグループです。サブアレイごとに遅延線や受信機を設けます。', 'g-subarray'],
  [7, 'デジタルビーム形成（DBF、digital beamforming）', '素子またはサブアレイごとに信号をデジタル化してから、計算によって重み付けして加算し、ビームを形成する方法です。複数のビームを同時に形成できます。', 'g-dbf'],
  [7, 'ヌル（null）', 'パターンの中で感度がほぼ 0 になる方向です。妨害の方向にヌルを向けると、妨害を抑圧できます。', 'g-null']
);
GLOSS.push(
  [8, 'モノパルス（monopulse）', '複数のビームで同時に受信した信号を比較し、1 つのパルスだけで目標の角度誤差を求める方式です。同時ローブ（simultaneous lobing）とも呼びます。', 'g-monopulse'],
  [8, '振幅比較モノパルス（amplitude-comparison monopulse）', '方向をわずかずつ変えた複数のビームで受信した信号の振幅の違いから、角度誤差を求めるモノパルスです。', 'g-amplitude-comparison-monopulse'],
  [8, '和信号と差信号（sum / difference signals、Σ・Δ）', '複数のビームの信号を加算したもの（和信号 Σ）と減算したもの（差信号 Δ）です。和信号は目標の検出と測距に、差信号は角度誤差の測定に使います。', 'g-sum-and-difference-signals'],
  [8, 'コンパレータ（comparator）', 'ホーン（給電部）の信号を加算・減算して、和信号と差信号を作るマイクロ波回路です。', 'g-comparator'],
  [8, '角度誤差信号（angle-error signal）', 'アンテナの軸と目標の方向との差を表す信号です。モノパルスでは差信号を和信号で割って求めます。大きさが角度誤差の大きさを、符号が角度誤差の方向を表します。', 'g-angle-error-signal'],
  [8, '誤差傾斜（error slope、km、モノパルス傾斜）', '目標が軸からわずかに外れた場合に、角度誤差信号（Δ/Σ）がどれだけ変化するかを表す値です。ビーム幅 1 つ分の角度に対する変化で表し、モノパルス傾斜とも呼びます。大きいほど、雑音による測角誤差が小さくなります。', 'g-error-slope'],
  [8, 'スクイント角（squint angle、ビームのオフセット角）', '角度を測定するために、ビームをアンテナの軸から意図的に傾ける角度です。', 'g-squint-angle'],
  [8, '円錐走査（conical scan）', '軸からわずかに傾けたビームを、軸のまわりに回転させる方式です。エコーの振幅の変化（変調）の大きさと位相から、角度誤差を求めます。', 'g-conical-scan'],
  [8, 'ローブ切替（sequential lobing）', 'ビームの方向を複数の位置に順に切り替えて、エコーの振幅を比較する方式です。', 'g-sequential-lobing'],
  [8, 'AGC（automatic gain control、自動利得制御）', '信号の振幅が変化しても出力が一定になるように、受信機の利得を自動的に変える機能です。モノパルスの受信機では、和信号による除算の役割をもちます。', 'g-agc'],
  [8, 'サーボ（servo）', '誤差信号が 0 になるように、アンテナを自動的に駆動する機構です。', 'g-servo'],
  [8, 'サーボ帯域幅（servo bandwidth）', 'サーボが追従できる周波数の上限です。広いほど応答は速くなりますが、雑音の影響も受けやすくなります。', 'g-servo-bandwidth'],
  [8, '捕捉（acquisition）', '追尾を開始するために、目標をビームと距離ゲートの中に入れることです。', 'g-acquisition'],
  [8, '早期ゲートと後期ゲート（early / late gates）', '距離ゲートを前半と後半に分けたものです。それぞれに入るエコーのエネルギーを比較して、ゲートの中心と目標の距離との差を求めます。', 'g-early-late-gates'],
  [8, 'グリント（glint、角度雑音）', '目標内の複数の反射点からのエコーが干渉して、見かけの到来方向が不規則に変動する現象です。見かけの方向が目標の外側に出ることもあります。', 'g-glint'],
  [8, 'シンチレーション（scintillation、振幅雑音）', '目標のエコーの振幅が時間とともに変動する現象です。', 'g-scintillation'],
  [8, 'マルチパス（multipath、多重反射）', '直接の経路に加えて地面や海面で反射した経路も通り、電波が 2 つ以上の経路で到達する現象です。', 'g-multipath'],
  [8, '鏡像（image、イメージ）', '地面や海面での反射によって、反射面の下に目標があるように見えるものです。鏡に映った像に相当します。', 'g-image'],
  [8, 'ミリラジアン（mrad）', '角度の単位です。1 mrad = 0.001 ラジアン ≈ 0.057° であり、距離 1 km で幅 1 m を見込む角度に当たります。', 'g-mrad']
);
GLOSS.push(
  [9, '伝搬（propagation）', '電波が空間を伝わることです。大気や地面・海面の影響によって、伝わり方が変わります。', 'g-propagation'],
  [9, '自由空間（free space）', '地球や大気の影響がまったくない、理想的な空間です。伝搬を比較する際の基準にします。', 'g-free-space'],
  [9, '伝搬因子（propagation factor、F）', '実際の電界強度を同じ距離での自由空間の電界強度で割った値です。1 より大きければ自由空間より強く、小さければ弱いことを表します。', 'g-propagation-factor'],
  [9, '自由空間伝搬損失（free-space path loss）', '自由空間で等方性アンテナどうしの間に生じる伝搬損失（片道）です。距離の 2 乗と周波数の 2 乗に比例します。', 'g-free-space-path-loss'],
  [9, '伝搬損失（propagation loss）', '等方性アンテナどうしの間での送信電力と受信電力の比を dB で表した値です。自由空間伝搬損失から 20·log F を引いた値になります。', 'g-propagation-loss'],
  [9, '屈折（refraction）', '電波が空気の屈折率の異なる領域を通過する際に、進行方向を変える現象です。', 'g-refraction'],
  [9, '屈折率（index of refraction、n）', '真空中の電波の速度を、その場所での速度で割った値です。地表付近の空気では 1.00025〜1.0004 です。', 'g-index-of-refraction'],
  [9, '屈折度（refractivity、N）', '屈折率 n から 1 を引いて 10⁶ 倍した値です。地表付近では 300 前後であり、高度とともに減少します。', 'g-refractivity'],
  [9, '修正屈折度（modified refractivity、M）', '屈折度 N に地球の曲率に相当する項（高度 1 km につき約 157）を加えた値です。M が高度とともに減少する層がダクトです。', 'g-modified-refractivity'],
  [9, '標準大気（standard atmosphere）', '屈折度が高度 1 km につき約 39 N だけ減少する、平均的な大気の状態です。等価地球半径係数は約 4/3 になります。', 'g-standard-atmosphere'],
  [9, '等価地球半径（effective earth radius）', '屈折による電波の曲がりを直線で表すために、実際より大きく仮定した地球の半径です。標準大気では実際の半径の約 4/3 倍になります。', 'g-effective-earth-radius'],
  [9, 'レーダ水平線（radar horizon）', 'レーダから放射された電波が、地球の表面にちょうど接する点です。これより先の低い位置は、地球の影領域になります。', 'g-radar-horizon'],
  [9, '見通し距離（line-of-sight range）', 'アンテナと目標が地球の陰に入らずに互いを直接見通せる最大の距離です。アンテナと目標のそれぞれのレーダ水平線までの距離の和になります。', 'g-line-of-sight-range'],
  [9, '回折（diffraction）', '電波が障害物の陰にわずかに回り込む現象です。周波数が低いほど回り込みやすくなります。', 'g-diffraction'],
  [9, '反射係数（reflection coefficient）', '反射波の電界強度を入射波の電界強度で割った値です。滑らかな海面に浅い角度で入射する場合は 1 に近くなります。', 'g-reflection-coefficient'],
  [9, '直接波と反射波（direct / reflected wave）', 'レーダと目標の間を直進する波（直接波）と、海面や地面で一度反射して届く波（反射波）です。', 'g-direct-and-reflected-wave'],
  [9, 'ローブ（lobe）', '直接波と反射波が強め合って、電波が強くなる角度の範囲です。高さの方向にヌルと交互に並びます。', 'g-lobe'],
  [9, 'カバレッジ図（coverage diagram）', '距離と高度の平面上に、探知できる範囲や伝搬損失を示した図です。', 'g-coverage-diagram'],
  [9, '異常伝搬（anomalous propagation）', '大気が標準の状態と異なるために、電波の曲がり方が標準と異なる現象です。', 'g-anomalous-propagation'],
  [9, 'サブリフラクション（subrefraction）', '電波が標準より曲がらない、または上向きに曲がる状態です。見通し距離が短くなります。', 'g-subrefraction'],
  [9, 'スーパーリフラクション（superrefraction）', '電波が標準より強く下向きに曲がる状態です。見通し距離が長くなります。', 'g-superrefraction'],
  [9, 'トラッピング（trapping）', '電波の曲率が地球の曲率より大きくなり、電波が大気の層の中に捕捉される状態です。', 'g-trapping'],
  [9, 'ダクト（duct）', '電波が捕捉されて、地表に沿って遠距離まで伝搬する大気の層です。修正屈折度 M が高度とともに減少する層に当たります。', 'g-duct'],
  [9, '蒸発ダクト（evaporation duct）', '海面の直上で水蒸気量が高度とともに急激に減少するために形成されるダクトです。海上ではほぼ常に存在します。', 'g-evaporation-duct'],
  [9, 'レーダホール（radar hole）', 'ダクトによって電波が到達しにくくなる、ダクトの直上の領域です。この領域にある目標は探知しにくくなります。', 'g-radar-hole'],
  [9, 'スキップゾーン（skip zone）', 'レーダ水平線の付近で、ダクトの効果が現れない距離の範囲です。', 'g-skip-zone']
);
GLOSS.push(
  [10, '散乱（scattering）', '電波が物体に入射して、さまざまな方向へ再放射される現象です。', 'g-scattering'],
  [10, '後方散乱（backscattering）', '散乱のうち、電波の到来方向（レーダの方向）へ戻る成分です。これがレーダのエコーになります。', 'g-backscattering'],
  [10, 'dBsm', '1 m² を基準としたデシベルで RCS を表す単位です。0 dBsm = 1 m²、20 dBsm = 100 m²、−20 dBsm = 0.01 m² です。', 'g-dbsm'],
  [10, 'アスペクト角（aspect angle）', 'レーダから見た目標の姿勢を表す角度です。', 'g-aspect-angle'],
  [10, '反射点（scatterer / scattering center、散乱中心）', '目標の表面のうち、エコーを強く返す箇所です。複雑な形状の目標は、多数の反射点の集合として扱います。', 'g-scatterer'],
  [10, '鏡面反射（specular reflection）', 'レーダの視線に垂直な面が、鏡のように電波を到来方向へ返す反射です。その方向では強く、面がわずかに傾くと急激に弱くなります。', 'g-specular-reflection'],
  [10, 'レイリー領域（Rayleigh region）', '目標が波長より小さい範囲です。RCS は周波数の 4 乗に比例して急激に変化し、形状の細かな違いは影響しません。', 'g-rayleigh-region'],
  [10, '共振領域（resonance region）', '目標が波長と同程度の範囲です。複数の反射の機構が干渉して、RCS が大きさ（周波数）とともに振動します。', 'g-resonance-region'],
  [10, '光学領域（optics region）', '目標が波長よりはるかに大きい範囲です。光の反射と同様に扱う近似がよく成り立ちます。', 'g-optics-region'],
  [10, 'クリーピング波（creeping wave）', '球などの物体の影の側を回り込んで戻ってくる波です。', 'g-creeping-wave'],
  [10, '進行波エコー（traveling-wave echo）', '電波が表面にごく浅い角度で入射した場合に、表面に沿って進む波が端で反射して戻るエコーです。', 'g-traveling-wave-echo'],
  [10, 'コーナーリフレクタ（corner reflector）', '2 枚または 3 枚の平板を直角に組み合わせた反射器です。広い角度範囲から入射した電波を、到来方向へ返します。', 'g-corner-reflector'],
  [10, '幾何光学（geometric optics、GO）', '電波を光線として扱い、反射点での面の曲率から RCS を求める近似です。', 'g-geometric-optics'],
  [10, '物理光学（physical optics、PO）', '面上に流れる電流を近似して積分し、RCS を求める方法です。平面や、一方向だけに曲がった面に使います。', 'g-physical-optics'],
  [10, 'モーメント法（method of moments）', '面上の電流についての方程式を、連立 1 次方程式に変換して解く方法です。厳密ですが、大きな目標では計算量が大きくなります。', 'g-method-of-moments'],
  [10, 'バイスタティック（bistatic）', '送信と受信を離れた別々の場所で行う方式です。同じ場所で行う方式はモノスタティックと呼びます。', 'g-bistatic'],
  [10, '遠方界の条件（far-field criterion）', '目標に入射する波を平面波とみなせる距離の目安です。距離 R > 2D²/λ（D は目標の大きさ）で表されます。', 'g-far-field-criterion'],
  [10, 'コンパクトレンジ（compact range）', '反射鏡などによって平面波を作り、短い距離で RCS を測定できるようにした屋内の測定設備です。', 'g-compact-range'],
  [10, '電波吸収材（radar-absorbing material、RAM）', '入射した電波のエネルギーを吸収して、反射を弱める材料です。', 'g-ram'],
  [10, 'サリスバリースクリーン（Salisbury screen）', '金属面の 1/4 波長手前に抵抗膜を置いた、最も簡単な吸収体です。設計周波数の付近だけで有効です。', 'g-salisbury-screen'],
  [10, '形状制御（shaping）', '面やエッジの方向を選んで、エコーをレーダの方向からそらす設計の方法です。', 'g-shaping']
);
GLOSS.push(
  [11, '合成開口レーダ（SAR、synthetic aperture radar）', '小さなアンテナを移動させながら収集した信号を合成して、長いアンテナと同等の分解能を得るレーダです。地表の画像の生成に使います。', 'g-sar'],
  [11, '実開口レーダ（RAR、real aperture radar）', 'アンテナそのものの大きさ（ビーム幅）で分解能が決まる、通常のレーダです。', 'g-real-aperture-radar'],
  [11, '合成開口（synthetic aperture）', 'プラットフォームが移動した経路を、1 本の長いアンテナとみなしたものです。その長さを合成開口長、目標から見たその角度を合成開口角と呼びます。', 'g-synthetic-aperture'],
  [11, 'レンジ方向とクロスレンジ方向（range / crossrange）', 'レーダの視線に沿った方向（レンジ方向）と、それに垂直で地面に平行な方向（クロスレンジ方向）です。クロスレンジ方向は、アジマス方向とも呼びます。', 'g-range-and-crossrange'],
  [11, 'クロスレンジ分解能（crossrange resolution、アジマス分解能）', '視線に垂直な方向で、2 つの目標を分離できる最小の間隔です。アジマス分解能とも呼びます。', 'g-crossrange-resolution'],
  [11, 'ストリップマップ（stripmap SAR）', 'ビームを飛行経路に垂直に向けたまま飛行し、帯状の範囲を連続して画像化する方式です。', 'g-stripmap-sar'],
  [11, 'スポットライト（spotlight SAR）', '飛行しながらビームを同じ場所に向け続け、その場所を高い分解能で画像化する方式です。', 'g-spotlight-sar'],
  [11, 'ドップラビームシャープニング（DBS、doppler beam sharpening）', 'ビームの中のエコーをドップラ周波数によって分離して、ビーム幅で決まる値より高い分解能を得る方法です。SAR の最初の呼び名でもあります。', 'g-dbs'],
  [11, '非集束 SAR（unfocused SAR）', '位相を補正せずに信号を加算する、初期の SAR です。使用できる合成開口長に限界があります。', 'g-unfocused-sar'],
  [11, '位相履歴（phase history）', 'プラットフォームが移動する間に、1 つの目標からのエコーの位相が示す変化です。', 'g-phase-history'],
  [11, 'ファストタイムとスロータイム（fast time / slow time）', '1 つのパルスの中の時間（距離に対応）と、パルスからパルスへの時間（クロスレンジに対応）です。', 'g-fast-and-slow-time'],
  [11, 'スクイント角（squint angle、SAR の場合）', 'アンテナの方向が飛行経路に垂直な方向から外れている角度です。', 'g-squint-angle-sar'],
  [11, '動揺補償（motion compensation）', 'プラットフォームが理想的な直線から外れた量を測定し、信号の位相を補正する処理です。', 'g-motion-compensation'],
  [11, 'レンジマイグレーション（range migration）', 'データの収集中に目標距離が変化して、エコーが別の距離セルへ移る現象です。', 'g-range-migration'],
  [11, 'スラントプレーンとグランドプレーン（slant plane / ground plane）', '視線に沿った斜めの面（スラントプレーン）と、地表面（グランドプレーン）です。地表面上での距離分解能は、スラントプレーン上より低くなります。', 'g-slant-and-ground-plane'],
  [11, '点像応答（point spread function / impulse response）', '点目標 1 つが、画像上でどのように広がるかを表すものです。', 'g-point-spread-function'],
  [11, '積分サイドローブ比（ISLR、integrated sidelobe ratio）', '点像応答のサイドローブ全体のエネルギーを、メインローブのエネルギーで割った値です。', 'g-islr'],
  [11, 'スペックル（speckle）', '一様な地面でも画素ごとに輝度がばらつく現象です。画素の中の多数の散乱体のエコーが干渉して生じます。', 'g-speckle'],
  [11, 'マルチルック（multilook）', '同じ場所の画像を複数生成して輝度を平均し、スペックルを低減する処理です。', 'g-multilook'],
  [11, '雑音等価 σ⁰（NEσ⁰、noise-equivalent sigma zero）', '受信機の雑音と同じ輝度になる、地面の後方散乱係数です。これより反射の弱い地面は、雑音に埋もれます。', 'g-nesz'],
  [11, '逆合成開口レーダ（ISAR、inverse SAR）', 'レーダではなく目標の運動（回転）を利用して、目標の画像を生成する方法です。', 'g-isar'],
  [11, '干渉 SAR（InSAR、interferometric SAR）', '2 つのアンテナの信号の位相差を使って、高さや変位を測定する SAR です。', 'g-insar']
);
GLOSS.push(
  [12, '電子戦（EW、electronic warfare）', '電磁波の利用をめぐる軍事的な活動の全体です。相手の電波の傍受、相手による利用の妨害、自らの利用の防護を含みます。', 'g-electronic-warfare'],
  [12, '電子支援（ESM、electronic warfare support measures）', '相手が放射する電波を探索・傍受し、位置や種類を調べる活動です。新しい用語では ES と呼びます。', 'g-esm'],
  [12, '電子攻撃（ECM、electronic countermeasures）', '相手のレーダなどが電磁波を有効に利用することを、妨げたり弱めたりする活動です。新しい用語では EA と呼びます。', 'g-ecm'],
  [12, '電子防護（ECCM、electronic counter-countermeasures）', '相手の電子攻撃があっても、レーダなどが電磁波を有効に利用できるようにする、レーダ側の対策です。新しい用語では EP と呼びます。', 'g-eccm'],
  [12, '妨害（jamming）', 'レーダの受信を妨げる目的で電波を放射することです。そのための装置を妨害機（jammer）と呼びます。', 'g-jamming'],
  [12, '雑音妨害（noise jamming）', '雑音に似た電波でレーダの受信帯域を覆い、目標のエコーを埋もれさせる妨害です。狭い帯域に集中するスポット妨害と、広い帯域を覆うバラージ妨害があります。', 'g-noise-jamming'],
  [12, '欺まん（deception）', '偽の信号によって、レーダに誤った情報（偽目標、誤った距離・速度・角度）を与えることです。', 'g-deception'],
  [12, 'チャフ（chaff）', '空中に散布する、金属を付けた細い繊維や箔です。レーダでは雨雲に似たクラッタとして観測されます。', 'g-chaff'],
  [12, 'デコイ（decoy）', '真の目標のように見せるための、おとりの物体です。', 'g-decoy'],
  [12, '自己防御妨害とスタンドオフ妨害（SSJ / SOJ）', '目標自身が妨害の電波を放射する場合（自己防御妨害、self-screening jammer）と、離れた位置の別の機体が放射する場合（スタンドオフ妨害、stand-off jammer）です。', 'g-ssj-soj'],
  [12, '実効放射電力（ERP、effective radiated power）', '送信電力にアンテナ利得を掛けた値です。その方向へ放射される電力の大きさを表します。', 'g-erp'],
  [12, '妨害対雑音比（J/N、JNR）', '受信機に入る妨害の電力を、受信機の雑音電力で割った値です。', 'g-jnr'],
  [12, '信号対妨害比（S/J）', '目標のエコーの電力を、妨害の電力で割った値です。', 'g-sjr'],
  [12, 'バーンスルー（burn-through）', '目標が接近してエコーが妨害より強くなり、妨害がある状況でも探知できるようになることです。その距離をバーンスルー距離と呼びます。', 'g-burn-through'],
  [12, 'サイドローブブランキング（SLB、sidelobe blanking）', '主アンテナと利得の低い補助アンテナの受信電力を比較し、サイドローブから入ったと判定した信号を、表示と検出の対象から除く方式です。', 'g-sidelobe-blanking'],
  [12, 'サイドローブキャンセラ（SLC、sidelobe canceler）', '補助アンテナで受信した妨害に係数を掛けて主アンテナの信号から減算し、サイドローブから入る妨害を打ち消す方式です。', 'g-sidelobe-canceler'],
  [12, '補助アンテナ（auxiliary antenna）', 'SLB や SLC のために主アンテナの近くに置く、利得が低くビーム幅の広いアンテナです。', 'g-auxiliary-antenna'],
  [12, '妨害消去比（JCR、jammer cancellation ratio）', 'サイドローブキャンセラを使わない場合と使った場合の、出力の妨害電力の比です。', 'g-jammer-cancellation-ratio'],
  [12, '適応アレイ（adaptive array）', '受信信号に合わせて、素子ごとの重み付けの係数を自動的に変えるアレイアンテナです。妨害の方向にヌルを形成します。', 'g-adaptive-array'],
  [12, '周波数アジリティ（frequency agility）', 'パルスごと、またはパルスの組ごとに送信周波数を切り替えることです。', 'g-frequency-agility'],
  [12, '周波数ダイバーシティ（frequency diversity）', '複数の異なる周波数を、同時に、または組み合わせて使うことです。', 'g-frequency-diversity'],
  [12, '低被探知性（LPI、low probability of intercept）', '相手の受信機に傍受されにくいように、レーダの電波の放射のしかたを工夫することです。', 'g-lpi'],
  [12, 'レーダ警報受信機（RWR、radar warning receiver）', 'レーダの電波を受信して、照射されていることとその方向を知らせる受信機です。', 'g-rwr'],
  [12, '電波管制（EMCON、emission control）', '位置や意図を知られないように、電波を放射する時間・方向・周波数などを管理することです。', 'g-emcon'],
  [12, 'ダイナミックレンジ（dynamic range）', '受信機が歪みなく扱える最大の信号と、雑音レベルとの比です。強いクラッタや妨害があっても飽和しないために必要です。', 'g-dynamic-range']
);
GLOSS.push(
  [13, 'レーダ資源管理（radar resource management）', 'レーダがもつ限られた時間とエネルギーを、捜索・追尾などの機能にどのように配分するかを決めることです。', 'g-radar-resource-management'],
  [13, 'ドウェル（dwell）とドウェル時間（dwell time）', 'ビームを 1 つのビーム位置に向けて送受信を行う、ひとまとまりの動作をドウェルと呼びます。その長さがドウェル時間であり、1 つのビーム位置を照射する時間に当たります。', 'g-dwell'],
  [13, 'スケジューラ（scheduler）', '要求されたタスクをいつ実行するかを決めて、時間軸上に配置する機能です。', 'g-scheduler'],
  [13, '占有率（occupancy）', 'レーダの時間のうち、照射に使われている割合です。', 'g-occupancy'],
  [13, 'スケジューラの効率（scheduler efficiency）', '（全時間 − 空き時間の合計）÷ 全時間で表される値です。タスクを空き時間なく配置できたかどうかを表します。', 'g-scheduler-efficiency'],
  [13, '固定タスク（fixed task）', '実行すべき時刻が決まっているタスクです。追尾の更新などが該当します。許容幅の範囲であれば、時刻を前後に変更できます。', 'g-fixed-task'],
  [13, '柔軟タスク（flexible task）', '実行する時刻は決まっていないものの、一定のパターン（1 フレーム）を、ある周期で繰り返したいタスクです。捜索などが該当します。', 'g-flexible-task'],
  [13, '希望時刻（requested time）', '固定タスクを実行すべき時刻です。', 'g-requested-time'],
  [13, '時刻の許容幅（slack）', '固定タスクの実行を、希望時刻から前後に変更してよい範囲です。', 'g-slack'],
  [13, 'フレーム時間（frame time）', '捜索範囲全体を 1 回捜索する時間です。同じ方向を再び照射するまでの時間に当たります。', 'g-frame-time'],
  [13, '所望フレーム時間（DFT、desired frame time）', '柔軟タスクのパターンを 1 回実行する周期の目標値です。', 'g-desired-frame-time'],
  [13, 'パターンの長さ（PL、pattern length）', '柔軟タスクのパターン 1 フレーム分の照射時間の合計です。', 'g-pattern-length'],
  [13, 'スケジューリング区間（RSI、radar scheduling interval）', 'スケジューラがタスクを配置する、1 区切りの時間です。従来方式では長さが一定です。', 'g-rsi'],
  [13, '可変のスケジューリング区間（DRSI、dynamic RSI）', '固定タスクの終わりから、次の固定タスクの終わりまでを 1 区間とする考え方です。区間の長さは、そのつど変わります。', 'g-drsi'],
  [13, '次の固定タスク（NFT、next fixed task）', '次に実行する固定タスクです。これが可変のスケジューリング区間の終わりを決めます。', 'g-next-fixed-task'],
  [13, '柔軟タスクの遅れ（FTD、flexible task deficit）', '「現時点で完了しているはずの量」から「実際に完了した量」を引いた値です。大きいほど、そのタスクは遅れています。', 'g-flexible-task-deficit'],
  [13, '期限の近い順（EDF、earliest-deadline-first）', '期限が最も近いタスクから先に実行する、スケジューリングの方法です。計算機の処理の順序の決定に使われています。', 'g-edf'],
  [13, '貪欲なスケジューラ（greedy scheduler）', '先の状況を考慮せず、その時点で最も優先度の高いものから順に配置していくスケジューラです。', 'g-greedy-scheduler'],
  [14, 'エリア MTI（area MTI）', '残留クラッタを場所ごとに記憶しておき、次のスキャンで減算（または除算）する方法です。現在はクラッタマップと呼ぶことが多くなっています。', 'g-area-mti'],
  [14, 'マップセル（map cell）', 'クラッタマップの 1 つの区画です。距離と方位で区切ります。複数の分解能セルをまとめて 1 つのマップセルにすることが多くあります。', 'g-map-cell'],
  [14, '再帰フィルタ（recursive filter）', '前の出力に新しい入力を一定の割合で加えて、次の出力にするフィルタです。過去の値をすべて保存しなくても、平均に近い値が得られます。', 'g-recursive-filter'],
  [14, 'フィルタの定数 α', '再帰フィルタで新しい入力を加える割合（0〜1）です。小さいほど、長い期間の平均になります。', 'g-map-filter-constant'],
  [14, '実効的な平均回数（Leff）', '再帰フィルタが等しい重み付けで何回分を平均した場合と同じ安定性をもつかを表す数です。(2 − α) ÷ α で求められます。', 'g-effective-averages'],
  [14, 'クラッタマップ損失（clutter map loss）', '背景の平均をマップから推定するために、余分に必要になる S/N です。平均回数が少ないほど大きくなります。', 'g-clutter-map-loss'],
  [14, '過渡応答（transient response）', '背景が急に変化した場合（新しいクラッタが現れた場合など）に、マップの値が新しい強度に適応するまでの応答です。', 'g-transient-response'],
  [14, 'カットオフ速度（cutoff velocity）', 'クラッタマップが目標を背景として記憶し始める、目標の速度の境界です。マップセルの大きさとスキャンの間隔で決まります。', 'g-cutoff-velocity'],
  [14, 'スプレッディング（spreading）', 'マップセルをその中の受信信号だけでなく、隣接するセルの受信信号も使って更新することです。クラッタがセルの境界をまたいだ場合の誤警報を抑えます。', 'g-spreading'],
  [14, 'ゼロ速度フィルタ（zero-velocity filter）', 'ドップラ周波数が 0 に近い成分だけを取り出すフィルタです。静止しているクラッタと、視線を横切る目標が、この出力に現れます。', 'g-zero-velocity-filter'],
  [14, 'MTD（moving target detector）', 'ドップラフィルタバンク、ゼロ速度フィルタ、クラッタマップなどを組み合わせた、目標検出の方式です。', 'g-mtd'],
  [14, 'スーパークラッタビジビリティ（superclutter visibility）', '点状のクラッタの上を飛行する目標を、目標のエコーがクラッタより強いことを利用して検出できることです。', 'g-superclutter-visibility'],
  [14, '点状のクラッタ（discrete clutter / point clutter）', '建物や鉄塔のように、1 つのセルに集中して現れる強いクラッタです。', 'g-discrete-clutter'],
  [14, 'PPI（plan position indicator）', 'レーダを中心に置き、方位と距離によって周囲の状況を円形に表す表示です。上から見た地図のように見えます。', 'g-ppi'],
  [15, '最大探知距離（maximum detection range、Rmax）', '受信電力が最小検出信号と等しくなる距離です。これより遠い目標は検出できません。レーダ方程式から求めます。', 'g-maximum-detection-range'],
  [15, '熱雑音（thermal noise）', '受信機内の電子の熱運動によって生じる雑音です。その電力は 1 Hz あたり k·T₀ = 4×10⁻²¹ W（T₀ = 290 K）であり、受信機の帯域幅に比例します。', 'g-thermal-noise'],
  [15, '受信機の帯域幅（receiver bandwidth、B）', '受信機が通過させる周波数の幅です。広いほど雑音電力も増加します。通常はパルス幅の逆数程度に選びます（B·τ ≈ 1）。', 'g-receiver-bandwidth'],
  [15, '検出に必要な S/N（required S/N、(S/N)₁）', '1 つのパルスで所定の誤警報確率と検出確率を満たすために必要な S/N です。判定の基準と目標の RCS 変動の有無によって決まります。', 'g-required-snr-single-pulse'],
  [15, '積分効率（integration efficiency、Ei(n)）', 'n 個のパルスを積分したときに、理想（S/N が n 倍）に対してどれだけの改善が得られるかを表す数（0〜1）です。コヒーレント積分では 1 になります。', 'g-integration-efficiency'],
  [15, 'コヒーレント積分とノンコヒーレント積分（coherent / noncoherent integration）', '位相をそろえてパルスを加算する方法がコヒーレント積分、検波後の振幅だけを加算する方法がノンコヒーレント積分（非コヒーレント積分）です。後者の積分効率は 1 より小さくなります。', 'g-coherent-noncoherent-integration'],
  [15, 'デューティ比（duty cycle）', 'パルスを送信している時間の割合であり、パルス幅 × パルス繰り返し周波数で求められます。平均電力 = 尖頭電力 × デューティ比 の関係があります。', 'g-duty-cycle'],
  [15, 'システム損失（system loss、Ls）', '理想的な式で求めた値に対して実際の性能を低下させる要因を、まとめて表す数（1 より大きい）です。すべてを計上すると 10〜20 dB になることも珍しくありません。', 'g-system-loss'],
  [15, '立体角（solid angle、Ω）', '空間内の方向の範囲の大きさを表す量です。単位はステラジアン [sr] であり、全方向は 4π sr です。', 'g-solid-angle'],
  [15, 'ビームの立体角（beam solid angle、Ω₀）', 'アンテナのビームが占める立体角です。利得とは G = 4π/Ω₀ の関係があります。', 'g-beam-solid-angle'],
  [15, '電力開口積（power-aperture product）', '平均電力と有効開口面積の積 Pav·Ae です。捜索レーダの探知距離を決める量のうち、設計で選択できる最も重要なものです。', 'g-power-aperture-product'],
  [16, '送信機（transmitter）', '目的に合った波形を生成し、増幅して送信する部分です。性能を表す量は尖頭電力よりも平均電力です。', 'g-transmitter'],
  [16, '送受切換器（デュプレクサ、duplexer）', '1 つのアンテナを送信と受信で共用するための部分です。送信中は受信機を保護し、受信中はエコーを受信機へ導きます。', 'g-duplexer'],
  [16, '受信機（receiver）', '弱いエコーを検出できるレベルまで増幅する部分です。受信機自身が発生する雑音が、検出の限界を決めます。', 'g-receiver'],
  [16, '低雑音増幅器（LNA、low-noise amplifier）', '受信機の初段に置く、雑音の小さい増幅器です。受信機全体の雑音は、ほぼこの増幅器で決まります。', 'g-lna'],
  [16, '信号処理（signal processing）', '所望の信号を検出の妨げになる信号（雑音、クラッタなど）から分離する部分です。整合フィルタやドップラ処理が含まれます。', 'g-signal-processing'],
  [16, 'ドップラ処理（doppler processing）', 'パルスごとの位相の変化（ドップラ周波数）を使って、移動目標をクラッタやほかの目標から分離する処理です。', 'g-doppler-processing'],
  [16, '信号対クラッタ比（signal-to-clutter ratio）', '目標のエコーの電力を、クラッタの電力で割った値です。クラッタが雑音より強い場所では、この値によって検出が決まります。', 'g-signal-to-clutter-ratio'],
  [16, '判定（detection decision）', '処理後の出力をしきい値と比較し、超えた場合に「目標あり」とすることです。', 'g-detection-decision'],
  [16, 'データ処理（data processing）', '判定の後で検出点から目標の航跡を求める部分です。', 'g-data-processing'],
  [16, '分解能と精度（resolution / accuracy）', '分解能は近接した 2 つの目標を分離できる間隔です。精度は 1 つの目標の位置を測定する正確さです。精度は S/N が高いほど高く、分解能より小さい値になります。', 'g-resolution-and-accuracy'],
  [16, 'S/N バジェット', '受信機の入力から処理後まで、段階ごとの S/N の利得と損失を dB で並べた表です。この教材では図として示しています。', 'g-snr-ledger'],
  [17, '多機能レーダ（multifunction radar）', '1 台で捜索や追尾などの複数の機能を受け持つレーダです。ビームを電子的に走査し、機能ごとに時間を配分します。', 'g-multifunction-radar'],
  [17, '最小探知距離（minimum range）', '送信中は受信できないために、エコーを受信できない近距離の範囲です。パルス幅に比例します（c·τ/2）。', 'g-minimum-range'],
  [17, '設計表', '左に要求、右に現在の設計で達成できる値を並べて、要求を満たしているかどうかを比較する表です。この教材での呼び方です。', 'g-design-table'],
  [4, '変動目標（fluctuating target）', '観測ごとに RCS が変化する目標です。姿勢のわずかな変化によって RCS が大きく変わるために生じます。変動のしかたは Swerling モデルで表します。', 'g-fluctuating-target'],
  [-1, 'パルス繰り返し周期（PRI、pulse repetition interval）', '1 つのパルスを送信してから、次のパルスを送信するまでの時間です。PRF の逆数に当たります。', 'g-pri'],
  [-1, 'メインローブ（mainlobe、主ローブ）', 'アンテナパターンや圧縮後の応答のうち、最も大きいピークの部分です。その両側に現れる小さなピークがサイドローブです。', 'g-mainlobe'],
  [2, 'ノッチ（notch）', 'フィルタの応答が特定の周波数（速度）の付近で大きく落ち込んでいる部分です。MTI ではクラッタのある速度 0 の付近にノッチを置いてクラッタを除去します。応答が保たれている範囲は、通過域と呼びます。', 'g-notch'],
  [2, '残留クラッタ（clutter residue）', 'MTI やドップラ処理の後に、除去しきれずに残るクラッタの成分です。クラッタのスペクトル幅や装置の不安定性によって生じます。', 'g-clutter-residue'],
  [3, 'スカート部（skirt）', 'スペクトルやフィルタの応答で、ピークの両側に緩やかに低下しながら広がっている部分です。強い信号のスカート部が、近くの弱い信号を隠すことがあります。', 'g-skirt'],
  [8, '測角誤差・測距誤差・速度誤差（measurement errors）', '角度・距離・速度の測定値と真の値との差です。通常は標準偏差（RMS）で表します。熱雑音による成分は、S/N が高いほど小さくなります。', 'g-measurement-errors'],
  [12, 'ジッタ（jitter）', 'パルス繰り返し周期などのタイミングが、パルスごとに変動することです。意図的に変動させる場合と、装置の不安定性によって生じる場合があります。', 'g-jitter'],
  [15, 'ビーム位置とビーム位置数（beam position）', '捜索範囲を覆うために、ビームを順に向ける個々の方向をビーム位置と呼びます。その総数がビーム位置数であり、捜索範囲の立体角をビームの立体角で割った値が目安になります。', 'g-beam-position']
);

GLOSS.push(
  [101, '計算書', '前提・式・値・単位を 1 行ずつ並べ、性能値の根拠をたどれるようにした表です（この教材での呼び名です）。', 'g-calc-sheet'],
  [101, '感度（sensitivity）', '前提の値をわずかに変えたときに、結果がどれだけ変化するかを表す量です。どの前提が結果に大きく影響するかを把握するために使います（この教材での使い方です）。', 'g-sensitivity'],
  [101, '誤警報時間（false-report time、T_FR）', 'その時間内に 1 回以上の誤警報が生じる確率が 0.5 になる時間です（Marcum の定義）。平均誤警報間隔 T_AVG とは、T_FR ≈ T_AVG·ln 2 の関係があります。', 'g-false-report-time'],
  [101, 'セルあたりの誤警報確率（P_FA）', '距離とドップラで区切った 1 つのセルで、雑音だけによってしきい値を超える確率です。誤警報時間と判定するセル数から決定します。', 'g-pfa-per-cell'],
  [101, '必要 S/N（required SNR）', '所定の誤警報確率と検出確率を満たすために必要な S/N です。目標の変動モデルと、積分する数によって変わります。', 'g-required-snr'],
  [101, '非変動目標（nonfluctuating target、Marcum の目標）', 'RCS が観測ごとに変化しないと仮定した目標のモデルです。Swerling 0（または 5）と呼ぶこともあります。', 'g-nonfluctuating-target'],
  [101, 'Swerling 1〜4 と n_e', '目標の RCS 変動を表す 4 つの型です。1・3 はドウェルの中では RCS が一定で、ドウェルごとに変化します。2・4 は CPI ごとに変化します。1・2 は自由度 2、3・4 は自由度 4 のカイ二乗分布に従います。式の中では n_e（1、N_pdi、2、2·N_pdi）によって区別します。', 'g-swerling-cases'],
  [101, '変動損失（fluctuation loss）', '目標の RCS が変動するために、非変動目標より余分に必要になる S/N [dB] です。検出確率が高いほど大きくなります。', 'g-fluctuation-loss'],
  [101, 'ノンコヒーレント積分数（N_pdi、postdetection integration）', '検波後に加算（ノンコヒーレント積分）する CPI の数です。1 の場合は 1 つの CPI だけで判定します。', 'g-npdi'],
  [101, '積分損失（integration loss）', 'N 個をノンコヒーレント積分したときに、「S/N が N 倍になる」という理想に届かない量 [dB] です。', 'g-integration-loss'],
  [101, 'ルックとドウェル（look / dwell）', 'ドウェルは 1 つのビーム位置を照射するひとまとまりの時間です。ルックはその中の 1 回分の観測（PRF を変えた 1 回など）です。', 'g-look-and-dwell'],
  [101, 'M-of-N（ドウェルの検出確率）', 'N 回のルックのうち M 回以上で検出した場合に「目標あり」と判定する方式です。ドウェルの検出確率と誤警報確率は、1 ルックの確率から二項分布で求めます（式4.26）。', 'g-m-of-n'],
  [101, 'R_o（S/N が 1 になる距離）', 'レーダの諸元、目標の RCS、損失から決まる基準の距離です。これを使うと、S/N = (R_o/R)⁴ と表せます。', 'g-ro'],
  [101, '目標にかかる損失（L_T）', '目標の S/N を低下させる損失の合計です。クラッタにはかからない損失（ビーム形状、エクリプシング、ストラドル、CFAR、ガード）を含みます。', 'g-target-losses'],
  [101, 'ストラドル損失（straddle loss）', '目標がレンジゲートやドップラフィルタの中心から外れているために、出力が低下する損失です。', 'g-straddle-loss'],
  [101, '単一走査の検出確率（single-scan P_d）', '1 回の走査（1 回のドウェル）で目標を検出する確率です。', 'g-single-scan-pd'],
  [101, '累積検出確率（cumulative probability of detection、P_d,cum）', '接近する目標をある距離までに 1 回以上検出する確率です。各走査で見逃す確率の積を 1 から引いて求めます（式4.27）。', 'g-cumulative-pd'],
  [101, 'カイ二乗分布の上側確率（K_m）', '自由度 d のカイ二乗分布で、値が x を超える確率 K_m(x, d) = 1 − P(d/2, x/2) です。P は正則化した不完全ガンマ関数です。自由度 2 の場合は exp(−x/2) になります。', 'g-chi-square-upper-tail']
);
GLOSS.push(
  [102, '後方散乱係数（σ⁰、クラッタ反射係数）', '面状に分布するクラッタの、1 m² あたりのレーダ断面積です（無次元量で dB で表します）。地形、周波数、俯角によって大きく変化します。', 'g-sigma-zero'],
  [102, 'クラッタセル面積（A_c）', '1 つの分解能セルに含まれる地表面の面積です。俯角が小さい場合は、距離 × 方位ビーム幅 × 距離方向の幅（c·τ/2）で求められます。', 'g-clutter-cell-area'],
  [102, 'クラッタ対信号比（C/S）', '同じセルにあるクラッタと目標の、エコーの電力比です。距離が同じであるため、レーダ断面積の比（σ⁰·A_c ÷ σ_T）になります。', 'g-clutter-to-signal-ratio'],
  [102, '改善係数（improvement factor、I）', 'クラッタを抑圧する処理の前後で、信号とクラッタの比が何倍になったかを表す値です。目標の速度について平均した値で定義します。入門 第2回の「改善度」と同じ量です。', 'g-improvement-factor-m'],
  [102, 'クラッタ減衰（clutter attenuation、CA）', '処理の前後でのクラッタ対雑音比の比です。ハンドブックの第2章では、改善係数と同じ意味で使われています。', 'g-clutter-attenuation-m'],
  [102, 'S/C の改善（I_SCR）', 'クラッタ減衰にドップラフィルタのコヒーレント積分の利得を掛けた値です。フィルタごとに値が異なります。', 'g-scr-improvement'],
  [102, 'クラッタ可視係数（clutter visibility factor、V_oc）', 'クラッタを抑圧したあとで、目標が残留クラッタの何倍であれば所定の確率で検出できるかを表す値です。', 'g-clutter-visibility-factor'],
  [102, 'SCV（subclutter visibility、サブクラッタビジビリティ）', '目標が重畳するクラッタよりどれだけ小さくても検出できるかを表す値です。dB では改善係数 − V_oc で求められます。', 'g-scv'],
  [102, 'スペクトル幅（σ_f）', 'クラッタのドップラ周波数の分布の幅を、標準偏差で表した値です。クラッタの内部運動と、アンテナの走査によって生じます。', 'g-spectral-width'],
  [102, '安定度による上限', '送信機や発振器のパルス間の変動（位相、周波数、タイミング、振幅）によって決まる、改善係数の上限です。', 'g-stability-limit'],
  [102, '量子化雑音（quantization noise）', 'A/D 変換器の量子化による丸め誤差です。パルスごとに不規則であるため、キャンセラでは抑圧されません。', 'g-quantization-noise']
);
GLOSS.push(
  [103, 'あいまいさのない最大距離（アンアンビギュアスレンジ、unambiguous range、R_u）', '次のパルスを送信する前にエコーが戻る最大の距離であり、c/(2·PRF) で求められます。これより遠い目標は、近い距離に折り返して現れます。', 'g-unambiguous-range'],
  [103, 'あいまいさのない速度幅（unambiguous velocity）', 'アンビギュイティなしに区別できる速度の幅であり、PRF·λ/2（±半分ずつ）で求められます。MTI の最初のブラインド速度と同じ値です。', 'g-unambiguous-velocity'],
  [103, '低・中・高 PRF', 'アンビギュイティの生じ方によって分けた PRF の区分です。低 PRF では距離のアンビギュイティがなく、高 PRF では速度のアンビギュイティがなく、中 PRF では両方にアンビギュイティがあります。', 'g-prf-classes'],
  [103, 'アンビギュイティ番号（ambiguity number）', '見かけの距離（または速度）が、真の値から何回折り返した値であるかを表す整数です。', 'g-ambiguity-number'],
  [103, 'ゴースト（range ghost）', '複数の PRF で距離を決定するときに、別々の目標の候補が偶然一致して現れる、実在しない距離です。', 'g-range-ghost'],
  [103, 'デューティ比とエクリプシング', 'デューティ比は送信している時間の割合です。高 PRF ではほぼこの割合の距離が、エクリプシングによって受信できなくなります。', 'g-duty-and-blind-range'],
  [103, '距離ドップラ結合の計算（range-doppler coupling）', 'LFM で目標のドップラ周波数に比例して圧縮後のピークの時刻が偏移する現象です。時間の偏移は f_d·T/B で求められます。', 'g-range-doppler-coupling-m']
);
GLOSS.push(
  [104, 'モノパルス傾斜（誤差傾斜、monopulse slope、k_m）', 'モノパルスにおいて、目標の方向がビーム幅に等しい角度だけ変化したときの、差 ÷ 和の変化量です。給電方式によって 1.2〜1.9 の値をとり、大きいほど測角精度が高くなります。', 'g-monopulse-slope'],
  [104, '熱雑音による測定誤差', '受信機雑音によって測定値が不規則に変動する成分です。分解能を √(2·S/N) で割った値が目安であり、S/N が高いほど小さくなります。', 'g-thermal-noise-error'],
  [104, '距離雑音（range noise）', '目標の反射点が距離方向に分布しているために、測距値が不規則に変動する現象です。測角におけるグリントに相当します。', 'g-range-noise'],

let gPop = null, gFrom = null;

}

  const r = gFrom.getBoundingClientRect(), dw = document.documentElement.clientWidth, pw = gPop.offsetWidth, ph = gPop.offsetHeight;
  const left = Math.max(8, Math.min(r.left, dw - pw - 8)) + window.scrollX;

  gPop.style.left = left + 'px'; gPop.style.top = ((below ? r.bottom + 6 : r.top - 6 - ph) + window.scrollY) + 'px';
}

    return {c, tiles: [{k: '必要 S/N', v: fx(c.req, 2) + ' <small>dB</small>', s: SWN[S.sw] + '、P_d ' + fx(S.pd, 2) + '、N_pdi ' + S.npdi}, {k: '探知距離（1 回の P_d）', v: kmT(c.r1), s: 'フレーム時間 4 秒の R_o で'}, {k: '探知距離（累積の P_d）', v: kmT(c.rc), s: '現在のフレーム時間での値。1 回の P_d では ' + kmT(c.r1F)}, {k: '2 つの距離の比', v: fx(c.rc / c.r1F, 2) + ' <small>倍</small>'}]};
  },
  extra: () => checkTable(runChecks())});

bootM();
